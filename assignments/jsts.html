<html lang="en">
<head>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f1f5f9;
  --sb-bg:#ffffff;
  --top-bg:rgba(255,255,255,.97);
  --top-border:#e2e8f0;
  --panel:#ffffff;
  --panel-b:#e2e8f0;
  --text:#1e293b;
  --text-dim:#64748b;
  --text-bright:#0f172a;
  --text-mid:#475569;
  --amber:#fbbf24;
  --amber-dk:#b45309;
  --green:#10b981;
  --green-dk:#065f46;
  --blue:#3b82f6;
  --blue-dk:#1e40af;
  --violet:#7c3aed;
  --code-bg:#1e293b;
  --sb-w:290px;
  --top-h:56px;
  --sh:0 1px 4px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);
}
html{font-size:15px;scroll-behavior:smooth}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.65;
  min-height:100vh;overflow-x:hidden;
}

/* ── Top bar ─────────────────────────────────────────────────── */
#topbar{
  position:fixed;top:0;left:0;right:0;height:var(--top-h);z-index:300;
  background:var(--top-bg);border-bottom:1px solid var(--top-border);
  backdrop-filter:blur(12px);box-shadow:0 1px 8px rgba(0,0,0,.06);
  display:flex;align-items:center;gap:.75rem;padding:0 1rem;
}
#sb-toggle{
  background:none;border:1px solid #e2e8f0;color:var(--text);
  cursor:pointer;border-radius:7px;width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  font-size:.85rem;transition:background .15s,border-color .15s;flex-shrink:0;
}
#sb-toggle:hover{background:#f1f5f9;border-color:var(--amber)}
.tbar-logo{display:flex;align-items:center;text-decoration:none;flex-shrink:0}
.tbar-logo img{height:34px;width:auto;display:block}
.tbar-sep{color:var(--text-dim);font-size:.75rem;flex-shrink:0}
.tbar-pg{font-size:.76rem;font-weight:700;color:var(--text-mid);white-space:nowrap;flex-shrink:0}
#tbar-ch{flex:1;font-size:.76rem;color:var(--text-mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding-left:.25rem}
.tbar-right{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.tbar-btn{
  display:inline-flex;align-items:center;gap:.35rem;
  padding:.32rem .75rem;border-radius:7px;font-size:.73rem;font-weight:700;
  text-decoration:none;border:1px solid #e2e8f0;
  color:var(--text-mid);transition:all .15s;white-space:nowrap;
}
.tbar-btn:hover{border-color:var(--amber);color:var(--amber-dk);background:rgba(251,191,36,.05)}
.tbar-btn.accent{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.35);color:var(--amber-dk)}
.tbar-btn.accent:hover{background:rgba(251,191,36,.18)}

/* ── App layout ──────────────────────────────────────────────── */
#app{display:flex;padding-top:var(--top-h);height:100vh;overflow:hidden}

/* ── Sidebar ─────────────────────────────────────────────────── */
#sidebar{
  width:var(--sb-w);flex-shrink:0;background:var(--sb-bg);
  border-right:1px solid #e2e8f0;overflow-y:auto;overflow-x:hidden;
  transition:transform .25s cubic-bezier(.4,0,.2,1),width .25s;
  position:relative;z-index:200;
  scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent;
}
#sidebar::-webkit-scrollbar{width:4px}
#sidebar::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
#sidebar.collapsed{transform:translateX(calc(-1 * var(--sb-w)))}

.sb-head{
  padding:.85rem 1rem .7rem;border-bottom:1px solid #f1f5f9;
  position:sticky;top:0;background:var(--sb-bg);z-index:10;
}
.sb-head-title{
  font-size:.68rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;
  color:var(--amber-dk);display:flex;align-items:center;gap:.4rem;
}
.sb-head-title::before{
  content:'';display:inline-block;width:6px;height:6px;
  border-radius:50%;background:var(--amber);
}
.sb-head-meta{font-size:.74rem;color:var(--text-dim);margin-top:.25rem}

/* Group header in sidebar */
.sb-group-hd{
  padding:.55rem 1rem .3rem;
  font-size:.6rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-dim);background:var(--sb-bg);
  border-bottom:1px solid #f8fafc;
  display:flex;align-items:center;gap:.4rem;
}
.sb-group-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

.ch-link{
  display:flex;align-items:center;gap:.55rem;
  padding:.42rem 1rem .42rem 1.2rem;
  text-decoration:none;color:var(--text-mid);
  font-size:.82rem;line-height:1.4;
  transition:background .1s,color .1s;
  border-left:2px solid transparent;
  position:relative;
}
.ch-link:hover{background:#f1f5f9;color:var(--text)}
.ch-link.active{
  border-left-color:var(--lc,#fbbf24);
  background:rgba(var(--lc-rgb,251,191,36),.07);
  color:var(--text-bright);font-weight:600;
}
.ch-num{
  font-size:.71rem;font-weight:800;color:var(--text-dim);
  flex-shrink:0;width:22px;text-align:right;font-variant-numeric:tabular-nums;
}
.ch-link.active .ch-num{color:var(--lc,#fbbf24)}
.ch-qs-badge{
  margin-left:auto;font-size:.6rem;font-weight:700;
  color:var(--text-dim);background:#f1f5f9;
  border:1px solid #e2e8f0;border-radius:4px;
  padding:.1rem .38rem;white-space:nowrap;flex-shrink:0;
}

/* ── Content column ──────────────────────────────────────────── */
#content-col{
  flex:1;overflow-y:auto;overflow-x:hidden;position:relative;
  scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent;
}
#content-col::-webkit-scrollbar{width:6px}
#content-col::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:6px}
#prog{height:2px;position:sticky;top:0;z-index:50;background:transparent}
#prog-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--amber),var(--violet));
  transition:width .1s;
}
#main{padding:0;min-height:100%}

/* ── HOME ────────────────────────────────────────────────────── */
.home-wrap{max-width:1100px;margin:0 auto;padding:2.5rem 1.75rem}
.home-hero{
  text-align:center;padding:3rem 1.5rem;
  background:linear-gradient(160deg,#fffbeb 0%,#faf5ff 50%,#f0fdf4 100%);
  border-radius:16px;margin-bottom:2rem;border:1px solid #e2e8f0;
}
.home-eyebrow{
  display:inline-flex;align-items:center;gap:.5rem;
  background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);
  border-radius:999px;padding:.3rem .9rem;
  font-size:.72rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  color:var(--amber-dk);margin-bottom:1.25rem;
}
.home-hero h1{
  font-size:clamp(1.8rem,4vw,2.8rem);font-weight:900;
  letter-spacing:-.03em;line-height:1.1;color:var(--text-bright);margin-bottom:.5rem;
}
.home-hero h1 .g{
  background:linear-gradient(135deg,var(--amber),var(--violet));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.home-sub{color:var(--text-mid);font-size:.97rem;max-width:560px;margin:.75rem auto 2rem;line-height:1.6}
.home-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:1.5rem 3rem}
.hstat b{
  display:block;font-size:2rem;font-weight:900;
  background:linear-gradient(135deg,var(--amber),var(--violet));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1;
}
.hstat s{display:block;font-size:.68rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;text-decoration:none;margin-top:.2rem}

/* Group section on home */
.group-section{margin-bottom:1.75rem}
.group-label{
  display:flex;align-items:center;gap:.6rem;
  font-size:.7rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase;
  color:var(--text-dim);margin-bottom:.85rem;padding-bottom:.5rem;
  border-bottom:1px solid #e2e8f0;
}
.group-label-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* Stage cards */
.stages-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.85rem}
.st-card{
  background:var(--panel);border:1px solid var(--panel-b);border-radius:12px;
  overflow:hidden;cursor:pointer;
  box-shadow:var(--sh);
  transition:transform .18s,box-shadow .18s,border-color .18s;
}
.st-card:hover{
  transform:translateY(-3px);
  border-color:var(--cc,#fbbf24);
  box-shadow:0 8px 28px rgba(0,0,0,.1),0 0 0 1px var(--cc,#fbbf24);
}
.st-card-top{height:4px;background:var(--cc,#fbbf24)}
.st-card-body{padding:1rem 1.1rem}
.st-card-head{display:flex;align-items:center;gap:.7rem;margin-bottom:.5rem}
.st-num-badge{
  width:38px;height:38px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;
  background:rgba(var(--cc-rgb,251,191,36),.1);
  border:1px solid rgba(var(--cc-rgb,251,191,36),.25);
}
.st-num-badge span{font-size:.92rem;font-weight:900;color:var(--cc-dk,#b45309)}
.st-title{font-size:.9rem;font-weight:800;color:var(--text-bright);line-height:1.25}
.st-topic{font-size:.78rem;color:var(--text-dim);line-height:1.5;margin-bottom:.6rem;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st-foot{display:flex;align-items:center;justify-content:space-between}
.st-qs{font-size:.72rem;font-weight:700;color:var(--text-dim);
  background:#f8fafc;border:1px solid #e2e8f0;
  border-radius:5px;padding:.15rem .5rem}
.st-go{font-size:.74rem;font-weight:700;color:var(--cc-dk,#b45309);
  display:flex;align-items:center;gap:.3rem}

/* ── STAGE READER ────────────────────────────────────────────── */
.reader-wrap{max-width:900px;margin:0 auto;padding:2rem 2rem 4rem;min-width:0}
.stage-badge{
  display:inline-flex;align-items:center;gap:.4rem;
  background:rgba(var(--bc-rgb,251,191,36),.1);
  border:1px solid rgba(var(--bc-rgb,251,191,36),.3);
  border-radius:999px;padding:.25rem .85rem;
  font-size:.67rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  color:var(--bc-dk,#b45309);margin-bottom:1rem;display:inline-flex;
}

/* Prev/next nav */
.stage-nav{
  display:grid;grid-template-columns:1fr 1fr;gap:.75rem;
  padding:2.5rem 0 1rem;border-top:1px solid #e2e8f0;margin-top:2.5rem;
}
.nav-btn{
  display:flex;align-items:center;gap:.65rem;padding:.9rem 1rem;border-radius:10px;
  text-decoration:none;background:#fff;border:1px solid #e2e8f0;
  box-shadow:var(--sh);transition:all .15s;
}
.nav-btn:hover{border-color:var(--amber);box-shadow:0 4px 16px rgba(251,191,36,.15)}
.nav-btn.prev{flex-direction:row}
.nav-btn.next{flex-direction:row-reverse;text-align:right}
.nav-btn:last-child:nth-child(2){grid-column:2}
.nav-arrow{font-size:.8rem;color:var(--amber-dk);flex-shrink:0}
.nav-label{font-size:.63rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);display:block;margin-bottom:.15rem}
.nav-title{font-size:.8rem;font-weight:700;color:var(--text-bright);line-height:1.3}

/* ── Markdown rendered content ───────────────────────────────── */
.md-body{
  background:#fff;border:1px solid #e2e8f0;border-radius:12px;
  padding:2rem 2.25rem;box-shadow:var(--sh);
  min-width:0;overflow-x:hidden;
}
.md-body h1{
  font-size:clamp(1.3rem,2.5vw,1.75rem);font-weight:900;
  color:var(--text-bright);letter-spacing:-.02em;line-height:1.2;
  border-bottom:2px solid #f1f5f9;padding-bottom:.75rem;margin-bottom:1.5rem;
}
.md-body h2{
  font-size:1.05rem;font-weight:800;color:var(--amber-dk);
  margin:2rem 0 .75rem;letter-spacing:-.01em;
  padding:.5rem .9rem;
  background:rgba(251,191,36,.07);border-left:3px solid var(--amber);
  border-radius:0 8px 8px 0;
}
.md-body h3{
  font-size:.95rem;font-weight:700;color:var(--text-bright);
  margin:1.5rem 0 .5rem;
}
.md-body p{font-size:.94rem;color:var(--text);line-height:1.85;margin:.6rem 0}
.md-body ul,.md-body ol{margin:.5rem 0 .5rem 1.5rem;display:flex;flex-direction:column;gap:.3rem}
.md-body li{font-size:.92rem;color:var(--text);line-height:1.75}
.md-body li::marker{color:var(--amber)}
.md-body strong{color:var(--text-bright);font-weight:700}
.md-body em{color:var(--amber-dk);font-style:italic}
.md-body hr{border:none;border-top:1px solid #e2e8f0;margin:1.75rem 0}
.md-body a{color:#0284c7;text-decoration:none}
.md-body a:hover{text-decoration:underline}

/* Inline code */
.md-body code:not(.hljs){
  font-family:'Cascadia Code','Consolas','JetBrains Mono',monospace;
  font-size:.82em;background:#f1f5f9;border:1px solid #e2e8f0;
  color:#0369a1;border-radius:4px;padding:.1em .35em;white-space:nowrap;
}
/* Code blocks */
.md-body pre{
  position:relative;background:var(--code-bg) !important;
  border:1px solid #334155;border-radius:8px;
  overflow:hidden;margin:.75rem 0;
}
.md-body pre code.hljs{
  display:block;overflow-x:auto;padding:1rem 1.1rem;
  font-family:'Cascadia Code','Consolas','JetBrains Mono',monospace;
  line-height:1.7;font-size:.82rem;background:transparent !important;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent;
}
.copy-btn{
  position:absolute;top:.45rem;right:.55rem;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  color:#94a3b8;border-radius:5px;padding:.2rem .5rem;
  font-size:.63rem;cursor:pointer;transition:all .12s;
  display:flex;align-items:center;gap:.25rem;
}
.copy-btn:hover{background:rgba(255,255,255,.15);color:#e2e8f0}
.copy-btn.copied{color:#34d399;border-color:rgba(52,211,153,.3)}

/* Tables */
.md-body table{width:100%;border-collapse:collapse;font-size:.84rem;margin:.75rem 0;border-radius:8px;overflow:hidden;border:1px solid #e2e8f0}
.md-body th{background:#fffbeb;color:var(--amber-dk);padding:.6rem .9rem;text-align:left;font-size:.74rem;font-weight:700;letter-spacing:.03em;border-bottom:1px solid #e2e8f0}
.md-body td{padding:.5rem .9rem;border-bottom:1px solid #f1f5f9;color:var(--text);line-height:1.55;vertical-align:top}
.md-body tr:last-child td{border-bottom:none}
.md-body tr:hover td{background:#fffbeb}
.md-body .table-wrap{overflow-x:auto}

/* Output blocks */
.output-block{
  background:#0f172a;border:1px solid #1e293b;border-radius:8px;
  padding:.75rem 1rem;margin:.5rem 0;
  font-family:'Cascadia Code','Consolas','JetBrains Mono',monospace;
  font-size:.81rem;color:#94a3b8;line-height:1.7;overflow-x:auto;
}

/* ── Mobile overlay ──────────────────────────────────────────── */
#sb-overlay{
  display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:190;
  backdrop-filter:blur(2px);
}
#sb-overlay.show{display:block}

/* ── Utility ─────────────────────────────────────────────────── */
.fade-in{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ── Responsive ──────────────────────────────────────────────── */
@media(max-width:768px){
  :root{--sb-w:290px;--top-h:56px}
  #sidebar{
    position:fixed;top:var(--top-h);bottom:0;left:0;z-index:200;
    transform:translateX(calc(-1 * var(--sb-w)));transition:transform .25s;
  }
  #sidebar.open{transform:translateX(0)}
  .home-wrap,.reader-wrap{padding:1.25rem .85rem 3rem;min-width:0}
  .stages-grid{grid-template-columns:1fr}
  .stage-nav{grid-template-columns:1fr}
  .nav-btn.next{grid-column:1}
  .nav-btn:last-child:nth-child(2){grid-column:1}
  .tbar-label{display:none}
  .tbar-pg{max-width:110px;overflow:hidden;text-overflow:ellipsis}
  #tbar-ch{display:none}
  .home-hero{padding:1.5rem .75rem 2rem}
  .home-stats{gap:1rem 2rem}
  .hstat b{font-size:1.5rem}
  .md-body{padding:1.25rem 1rem}
  .md-body pre code.hljs{font-size:.76rem;padding:.75rem .85rem}
  .md-body table{font-size:.78rem}
}
@media(min-width:769px){
  #sidebar.collapsed{
    transform:translateX(calc(-1 * var(--sb-w)));
    width:0 !important;
  }
}
</style>

</head>
<body>

<header id="topbar">
  <button id="sb-toggle" aria-label="Toggle sidebar"><i class="fas fa-bars"></i></button>
  <a class="tbar-logo" href="/"><img src="../../assets/ulogo.jpg" alt="VibeTestQ"></a>
  <span class="tbar-sep">›</span>
  <span class="tbar-pg">JS / TS Assignments</span>
  <span id="tbar-ch"></span>
  <div class="tbar-right">
    <a class="tbar-btn" href="#home"><i class="fas fa-house"></i> <span class="tbar-label">Home</span></a>

<div id="sb-overlay"></div>

</div>

<script>
// ── Stage data ────────────────────────────────────────────────────────────────
const GROUPS = [
  {
    id:'js', label:'JavaScript Core', color:'#fbbf24', colorRgb:'251,191,36',
    colorDk:'#b45309', dot:'#fbbf24', icon:'fab fa-js',
    stages:[
      {num:1,  file:'stage-01-basics',               title:'Absolute Basics',         qs:'Q1–Q12',   count:12, topic:'Variables, scope, types, hoisting, pass by value/reference'},
      {num:2,  file:'stage-02-numbers',               title:'Numbers',                  qs:'Q13–Q22',  count:10, topic:'Factorial, Armstrong, perfect number, GCD/LCM, unique random'},
      {num:3,  file:'stage-03-strings-builtins',      title:'Strings — Built-ins',      qs:'Q23–Q33',  count:11, topic:'Built-in string methods, regex, frequency count'},
      {num:4,  file:'stage-04-strings-manual',        title:'Strings — Manual',         qs:'Q34–Q43',  count:10, topic:'Reverse, palindrome, anagram, compression without built-ins'},
      {num:5,  file:'stage-05-loops-patterns',        title:'Loops & Patterns',         qs:'Q44–Q54',  count:11, topic:'for/while/do-while, break/continue, star/number/diamond patterns'},
      {num:6,  file:'stage-06-arrays-builtins',       title:'Arrays — Built-ins',       qs:'Q55–Q64',  count:10, topic:'map, filter, reduce, find, flat, sort, slice, Array.from'},
      {num:7,  file:'stage-07-arrays-manual',         title:'Arrays — Manual',          qs:'Q65–Q72',  count:8,  topic:'Reverse, remove duplicates, bubble sort, selection sort, binary search'},
      {num:8,  file:'stage-08-functions',             title:'Functions',                qs:'Q73–Q91',  count:19, topic:'Default params, rest, destructuring, closures, memoize, debounce, throttle'},
      {num:9,  file:'stage-09-functional',            title:'Functional Patterns',      qs:'Q92–Q100', count:9,  topic:'Pure functions, immutability, compose, pipe, partial, deep merge'},
      {num:10, file:'stage-10-objects-oop',           title:'Objects & OOP',            qs:'Q101–Q115',count:15, topic:'Objects, classes, inheritance, private fields, method chaining, factories'},
      {num:11, file:'stage-11-data-structures',       title:'Data Structures',          qs:'Q116–Q122',count:7,  topic:'Map, Set, WeakMap, JSON'},
      {num:12, file:'stage-12-iterators-generators',  title:'Iterators & Generators',   qs:'Q123–Q127',count:5,  topic:'Symbol.iterator, generators, yield, infinite sequences'},
      {num:13, file:'stage-13-async-promises',        title:'Async & Promises',         qs:'Q128–Q137',count:10, topic:'Promises, chaining, async/await, Promise.all/race/any, retry'},
      {num:14, file:'stage-14-error-handling',        title:'Error Handling',           qs:'Q138–Q144',count:7,  topic:'try/catch/finally, custom errors, re-throwing, async errors'},
      {num:15, file:'stage-15-dates-time',            title:'Dates & Time',             qs:'Q145–Q157',count:13, topic:'Date formatting, arithmetic, comparison, timing, performance.now'},
    ]
  },
  {
    id:'node', label:'Node.js & Modules', color:'#10b981', colorRgb:'16,185,129',
    colorDk:'#065f46', dot:'#10b981', icon:'fab fa-node-js',
    stages:[
      {num:16, file:'stage-16-nodejs',   title:'Node.js',  qs:'Q158–Q167', count:10, topic:'fs, path, env, http, EventEmitter, npm scripts'},
      {num:17, file:'stage-17-modules',  title:'Modules',  qs:'Q168–Q182', count:15, topic:'Named/default exports, import * as, dynamic import, CommonJS'},
    ]
  },
  {
    id:'ts', label:'TypeScript', color:'#3b82f6', colorRgb:'59,130,246',
    colorDk:'#1e40af', dot:'#3b82f6', icon:'fas fa-t',
    stages:[
      {num:18, file:'stage-18-typescript-basics',          title:'TypeScript — Basics',        qs:'Q183–Q191', count:9,  topic:'Types, interfaces, generics, utility types, type guards'},
      {num:19, file:'stage-19-typescript-advanced',        title:'TypeScript — Advanced',      qs:'Q192–Q200', count:9,  topic:'Discriminated unions, mapped types, conditional types, decorators'},
      {num:20, file:'stage-20-typescript-test-automation', title:'TypeScript for Automation',  qs:'Q201–Q210', count:10, topic:'TestResult type, POM, factories, DeepReadonly, waitFor, satisfies'},
    ]
  }
];

// Flat list for prev/next
const ALL_STAGES = GROUPS.flatMap(g => g.stages.map(s => ({...s, group:g})));

// ── DOM refs ──────────────────────────────────────────────────────────────────
const sbNav      = document.getElementById('sb-nav');
const mainEl     = document.getElementById('main');
const progFill   = document.getElementById('prog-fill');
const tbarCh     = document.getElementById('tbar-ch');
const sbToggle   = document.getElementById('sb-toggle');
const sidebar    = document.getElementById('sidebar');
const overlay    = document.getElementById('sb-overlay');
const contentCol = document.getElementById('content-col');

// ── Build sidebar ─────────────────────────────────────────────────────────────
function buildSidebar() {
  sbNav.innerHTML = '';
  GROUPS.forEach(g => {
    // Group header
    const hd = document.createElement('div');
    hd.className = 'sb-group-hd';
    hd.innerHTML = `<span class="sb-group-dot" style="background:${g.dot}"></span>${g.label}`;
    sbNav.appendChild(hd);

    g.stages.forEach(s => {
      const a = document.createElement('a');
      a.className = 'ch-link';
      a.href = `#s${s.num}`;
      a.style.cssText = `--lc:${g.color};--lc-rgb:${g.colorRgb}`;
      a.dataset.snum = s.num;
      a.innerHTML = `
        <span class="ch-num">${s.num}</span>
        <span style="flex:1;min-width:0">${s.title}</span>
        <span class="ch-qs-badge">${s.qs}</span>`;
      sbNav.appendChild(a);
    });
  });
}

// ── Show home ─────────────────────────────────────────────────────────────────
function showHome() {
  tbarCh.textContent = '';
  document.title = 'JavaScript & TypeScript Assignments | VibeTestQ';

  const groupSections = GROUPS.map(g => {
    const cards = g.stages.map(s => `
      <div class="st-card" data-snum="${s.num}" style="--cc:${g.color};--cc-rgb:${g.colorRgb};--cc-dk:${g.colorDk}">
        <div class="st-card-top"></div>
        <div class="st-card-body">
          <div class="st-card-head">
            <div class="st-num-badge"><span>${s.num}</span></div>
            <div class="st-title">${s.title}</div>
          </div>
          <div class="st-topic">${s.topic}</div>
          <div class="st-foot">
            <span class="st-qs">${s.qs} &middot; ${s.count}Q</span>
            <span class="st-go">Open <i class="fas fa-arrow-right" style="font-size:.6rem"></i></span>
          </div>
        </div>
      </div>`).join('');

    return `
      <div class="group-section">
        <div class="group-label">
          <span class="group-label-dot" style="background:${g.dot}"></span>
          <i class="${g.icon}"></i> ${g.label}
        </div>
        <div class="stages-grid">${cards}</div>
      </div>`;
  }).join('');

  mainEl.innerHTML = `
    <div class="home-wrap fade-in">
      <div class="home-hero">
        <div class="home-eyebrow"><i class="fab fa-js"></i> JavaScript &amp; TypeScript</div>
        <h1>Practice Questions<br><span class="g">Stage by Stage</span></h1>
        <p class="home-sub">210 questions across 20 stages — from absolute basics to TypeScript for test automation. Work through each stage in order, write the code, verify the output.</p>
        <div class="home-stats">
          <div class="hstat"><b>210</b><s>Questions</s></div>
          <div class="hstat"><b>20</b><s>Stages</s></div>
          <div class="hstat"><b>3</b><s>Tracks</s></div>
        </div>
      </div>
      ${groupSections}
    </div>`;

  mainEl.querySelectorAll('.st-card').forEach(card => {
    card.addEventListener('click', () => { location.hash = '#s' + card.dataset.snum; });
  });

  document.querySelectorAll('.ch-link.active').forEach(l => l.classList.remove('active'));
}

// ── Load stage ────────────────────────────────────────────────────────────────
async function loadStage(num) {
  const entry = ALL_STAGES.find(s => s.num === num);
  if (!entry) { showHome(); return; }

  const g = entry.group;
  const mdPath = `jsts/${entry.file}.md`;

  mainEl.innerHTML = `<div class="reader-wrap" style="color:var(--text-dim);padding-top:3rem;text-align:center">
    <i class="fas fa-spinner fa-spin" style="font-size:1.5rem;color:${g.color}"></i>
    <p style="margin-top:.75rem;font-size:.85rem">Loading Stage ${num}…</p></div>`;

  let mdText;
  try {
    const res = await fetch(mdPath);
    if (!res.ok) throw new Error('fetch failed');
    mdText = await res.text();
  } catch {
    mainEl.innerHTML = `<div class="reader-wrap"><p style="color:#f87171;font-size:.9rem"><i class="fas fa-exclamation-triangle"></i> Could not load Stage ${num}.</p></div>`;
    return;
  }

  document.title = `Stage ${num}: ${entry.title} | JS/TS Assignments | VibeTestQ`;
  tbarCh.textContent = `Stage ${num} — ${entry.title}`;

  const htmlContent = marked.parse(mdText);

  const idx = ALL_STAGES.findIndex(s => s.num === num);
  const prev = idx > 0 ? ALL_STAGES[idx - 1] : null;
  const next = idx < ALL_STAGES.length - 1 ? ALL_STAGES[idx + 1] : null;

  const prevBtn = prev ? `
    <a class="nav-btn prev" href="#s${prev.num}">
      <span class="nav-arrow"><i class="fas fa-chevron-left"></i></span>
      <span class="nav-info">
        <span class="nav-label">Previous</span>
        <span class="nav-title">Stage ${prev.num} — ${prev.title}</span>
      </span>
    </a>` : '';

  const nextBtn = next ? `
    <a class="nav-btn next" href="#s${next.num}">
      <span class="nav-info">
        <span class="nav-label">Next</span>
        <span class="nav-title">Stage ${next.num} — ${next.title}</span>
      </span>
      <span class="nav-arrow"><i class="fas fa-chevron-right"></i></span>
    </a>` : '';

  mainEl.innerHTML = `
    <div class="reader-wrap fade-in" style="--bc:${g.color};--bc-rgb:${g.colorRgb};--bc-dk:${g.colorDk}">
      <div class="stage-badge">
        <i class="${g.icon}"></i> ${g.label} &nbsp;&middot;&nbsp; Stage ${num} &nbsp;&middot;&nbsp; ${entry.qs}
      </div>
      <div class="md-body">${htmlContent}</div>
      <div class="stage-nav">${prevBtn}${nextBtn}</div>
    </div>`;

  // Syntax highlight all code blocks
  mainEl.querySelectorAll('pre code').forEach(el => {
    hljs.highlightElement(el);
  });

  // Copy buttons
  mainEl.querySelectorAll('pre').forEach(pre => {
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.innerHTML = '<i class="fas fa-copy"></i> Copy';
    btn.addEventListener('click', () => {
      const code = pre.querySelector('code');
      navigator.clipboard.writeText(code ? code.innerText : pre.innerText).then(() => {
        btn.className = 'copy-btn copied';
        btn.innerHTML = '<i class="fas fa-check"></i> Copied';
        setTimeout(() => {
          btn.className = 'copy-btn';
          btn.innerHTML = '<i class="fas fa-copy"></i> Copy';
        }, 2000);
      });
    });
    pre.appendChild(btn);
  });

  // Wrap tables for horizontal scroll on mobile
  mainEl.querySelectorAll('.md-body table').forEach(tbl => {
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    tbl.parentNode.insertBefore(wrap, tbl);
    wrap.appendChild(tbl);
  });

  contentCol.scrollTo({ top: 0, behavior: 'smooth' });

  // Sidebar active
  document.querySelectorAll('.ch-link.active').forEach(l => l.classList.remove('active'));
  const activeLink = document.querySelector(`.ch-link[data-snum="${num}"]`);
  if (activeLink) {
    activeLink.classList.add('active');
    setTimeout(() => activeLink.scrollIntoView({ block: 'nearest' }), 150);
  }
}

// ── Progress bar ──────────────────────────────────────────────────────────────
contentCol.addEventListener('scroll', () => {
  const h = contentCol.scrollHeight - contentCol.clientHeight;
  progFill.style.width = (h > 0 ? (contentCol.scrollTop / h) * 100 : 0) + '%';
});

// ── Sidebar toggle ────────────────────────────────────────────────────────────
function openSidebar()  { sidebar.classList.add('open');    overlay.classList.add('show'); }
function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('show'); }
function toggleSidebar() {
  if (window.innerWidth <= 768) {
    sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
  } else {
    sidebar.classList.toggle('collapsed');
  }
}
sbToggle.addEventListener('click', toggleSidebar);
overlay.addEventListener('click', closeSidebar);

// ── Hash routing ──────────────────────────────────────────────────────────────
function route() {
  const hash = location.hash;
  if (!hash || hash === '#' || hash === '#home') {
    showHome();
  } else {
    const m = hash.match(/^#s(\d+)$/);
    if (m) {
      loadStage(parseInt(m[1]));
      if (window.innerWidth <= 768) closeSidebar();
    } else {
      showHome();
    }
  }
}

window.addEventListener('hashchange', route);

// ── Init ──────────────────────────────────────────────────────────────────────
buildSidebar();
route();
</script>
</body>
</html>
