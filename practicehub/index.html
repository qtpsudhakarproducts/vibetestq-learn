<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice Hub — JS, TypeScript & Playwright | VibeTestQ Academy</title>
<meta name="description" content="136 multiple-choice practice challenges across 11 topics with instant feedback, hints and explanations.">
<link rel="canonical" href="https://academy.vibetestq.com/practicehub/">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/assets/academy/chrome.css">
<script src="/auth-guard.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.55;padding-top:56px}
  .wrap{max-width:1040px;margin:0 auto;padding:1.6rem 1rem 3rem}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;flex-wrap:wrap;margin-bottom:1.4rem}
  .top h1{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;color:#0f172a;line-height:1.2}
  .top p{color:#64748b;font-size:.92rem;margin-top:.3rem;max-width:560px}
  .summary{display:flex;align-items:center;gap:1rem;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:.8rem 1rem;box-shadow:0 1px 4px rgba(0,0,0,.05)}
  .summary .num{font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1}
  .summary .num small{font-size:.8rem;font-weight:600;color:#64748b}
  .summary .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:#64748b;margin-top:.2rem}
  .bar{width:150px;height:8px;border-radius:99px;background:#e2e8f0;overflow:hidden;margin-top:.45rem}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0284c7,#7c3aed);border-radius:99px;transition:width .4s}
  .go{display:inline-flex;align-items:center;gap:.45rem;padding:.55rem 1rem;border-radius:10px;background:#0284c7;color:#fff;text-decoration:none;font-size:.86rem;font-weight:700;white-space:nowrap}
  .go:hover{background:#0369a1}
  .group{margin-top:1.6rem}
  .group-h{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin:0 .25rem .55rem}
  .group-h h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:#0369a1;font-weight:800}
  .group-h span{font-size:.78rem;color:#64748b}
  .table{background:#fff;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}
  .head,.row{display:grid;grid-template-columns:minmax(0,1fr) 112px 64px 170px 104px;align-items:center;gap:1rem;padding:.75rem 1.1rem}
  .head{background:#f8fafc;border-bottom:1px solid #e2e8f0;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:#64748b;font-weight:700}
  .row{border-bottom:1px solid #f1f5f9;text-decoration:none;color:inherit;transition:background .12s}
  .row:last-child{border-bottom:none}
  .row:hover{background:#f8fafc}
  .t{display:flex;align-items:center;gap:.8rem;min-width:0}
  .t>div:last-child{min-width:0}
  .ico{width:36px;height:36px;border-radius:10px;background:#e0f2fe;color:#0369a1;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .t b{display:block;font-size:.95rem;color:#0f172a;font-weight:700}
  .t span{display:block;font-size:.8rem;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lv{display:flex;gap:.25rem;flex-wrap:nowrap}
  .chip{min-width:26px;text-align:center;font-size:.74rem;font-weight:800;padding:.14rem .4rem;border-radius:99px;white-space:nowrap}
  .legend{display:flex;gap:.9rem;flex-wrap:wrap;font-size:.76rem;color:#64748b;margin:.2rem .25rem 0}
  .legend span{display:inline-flex;align-items:center;gap:.35rem}.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .chip.b{background:#ecfdf5;color:#047857}.chip.i{background:#fffbeb;color:#b45309}.chip.a{background:#fff1f2;color:#be123c}
  .n{font-size:.88rem;font-weight:700;color:#334155}
  .prog{font-size:.78rem;color:#475569}
  .prog .bar{width:100%;margin-top:.3rem}
  .btn{justify-self:end;display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .8rem;border-radius:8px;border:1px solid #cbd5e1;color:#0f172a;font-size:.78rem;font-weight:700;background:#fff}
  .row:hover .btn{border-color:#0284c7;color:#0369a1}
  .btn.primary{background:#0284c7;border-color:#0284c7;color:#fff}
  .row:hover .btn.primary{background:#0369a1;color:#fff}
  .done .ico{background:#dcfce7;color:#15803d}
  .note{margin-top:1.4rem;font-size:.78rem;color:#64748b;text-align:center}
  @media(max-width:860px){
    .head{display:none}
    .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t btn" "lv lv" "prog prog";row-gap:.55rem}
    .row .t{grid-area:t}.row .btn{grid-area:btn}.row .lv{grid-area:lv}.row .n{display:none}.row .prog{grid-area:prog}
    .t span{white-space:normal}
  }
</style>
<script defer src="/assets/academy/chrome.js"></script>
</head>
<body>
<main class="wrap" id="main">
  <div class="top">
    <div>
      <h1>Practice Hub</h1>
      <p>136 multiple-choice challenges across 11 topics, with instant feedback, hints and explanations.</p>
    </div>
    <div class="summary" aria-live="polite">
      <div><div class="num"><span id="solved">0</span> <small>/ 136 solved</small></div><div class="bar"><i id="overall"></i></div></div>
      <a class="go" id="continue" href="#"><i class="fas fa-play"></i> Start</a>
    </div>
  </div>
  <div class="legend" aria-hidden="true"><b style="color:#475569">Difficulty</b><span><i style="background:#10b981"></i>Beginner</span><span><i style="background:#f59e0b"></i>Intermediate</span><span><i style="background:#e11d48"></i>Advanced</span></div>
  <div id="groups"></div>
  <p class="note">Your progress is saved in this browser.</p>
</main>
<script>
const DATA = {"groups":[{"name":"Foundation","blurb":"The language and runner basics","topics":[{"page":"javascript","title":"JavaScript","icon":"fab fa-js-square","count":12,"desc":"Hoisting, closures, async/await, array methods, and modern ES6+ patterns every tester must know.","tags":["Hoisting","Closures","Async/Await"],"levels":{"beginner":6,"intermediate":5,"advanced":1},"key":"vtq-js-practice"},{"page":"typescript","title":"TypeScript","icon":"fas fa-code","count":10,"desc":"Type annotations, unions, intersection types, generics, type narrowing and strict mode rules.","tags":["Types","Generics","Type Guards"],"levels":{"beginner":5,"intermediate":4,"advanced":1},"key":"vtq-ts-practice"},{"page":"playwright","title":"Playwright Overview","icon":"fas fa-theater-masks","count":12,"desc":"Core Playwright concepts — test runner, context isolation, trace viewer, reporters, and CI patterns.","tags":["Test Runner","Context","CI/CD"],"levels":{"beginner":6,"intermediate":4,"advanced":2},"key":"vtq-pw-practice"}]},{"name":"Playwright Core","blurb":"Day-to-day test writing","topics":[{"page":"pw-locators","title":"Locators","icon":"fas fa-crosshairs","count":15,"desc":"getByRole, getByLabel, getByText, CSS, XPath, chaining, filtering, and locator best practices.","tags":["getByRole","getByLabel","Chaining"],"levels":{"beginner":5,"intermediate":7,"advanced":3},"key":"vtq-pw-locators"},{"page":"pw-assertions","title":"Assertions","icon":"fas fa-check-double","count":12,"desc":"toBeVisible, toHaveText, toHaveURL, soft assertions, expect.poll, retry-ability and assertion timeouts.","tags":["toBeVisible","Soft Assertions","Retry"],"levels":{"beginner":6,"intermediate":4,"advanced":2},"key":"vtq-pw-assertions"},{"page":"pw-fixtures","title":"Fixtures & Hooks","icon":"fas fa-plug","count":12,"desc":"test.extend(), fixture scopes, beforeEach vs fixtures, teardown with use(), and worker-scoped state.","tags":["test.extend","Scopes","Teardown"],"levels":{"beginner":3,"intermediate":4,"advanced":5},"key":"vtq-pw-fixtures"},{"page":"pw-config","title":"Configuration","icon":"fas fa-sliders","count":12,"desc":"playwright.config.ts — projects, baseURL, retries, workers, timeouts, use options, and reporters.","tags":["Projects","baseURL","Retries"],"levels":{"beginner":5,"intermediate":5,"advanced":2},"key":"vtq-pw-config"}]},{"name":"Advanced Playwright","blurb":"Framework-level skills","topics":[{"page":"pw-api-testing","title":"API Testing","icon":"fas fa-network-wired","count":15,"desc":"request fixture, APIRequestContext, authentication, response validation, and API+UI hybrid workflows.","tags":["request","APIContext","Auth"],"levels":{"beginner":9,"intermediate":4,"advanced":2},"key":"vtq-pw-api"},{"page":"pw-network","title":"Network Mocking","icon":"fas fa-wifi","count":12,"desc":"page.route(), route.fulfill(), route.abort(), HAR replay, waitForResponse, offline mode and cookie injection.","tags":["route()","fulfill()","HAR"],"levels":{"beginner":5,"intermediate":5,"advanced":2},"key":"vtq-pw-network"},{"page":"pw-pom","title":"Page Object Model","icon":"fas fa-sitemap","count":12,"desc":"Page class design, TypeScript constructor patterns, BasePage, component objects, fixtures, and when not to use POM.","tags":["Page Classes","BasePage","Fixtures"],"levels":{"beginner":6,"intermediate":6,"advanced":0},"key":"vtq-pw-pom"},{"page":"pw-bdd","title":"BDD / Cucumber","icon":"fas fa-list-check","count":12,"desc":"Gherkin syntax, Scenario Outline, Background, hooks, tags, World object, step definitions, and Data Tables.","tags":["Gherkin","Hooks","World"],"levels":{"beginner":6,"intermediate":4,"advanced":2},"key":"vtq-pw-bdd"}]}]};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function solvedCount(key) {
  try { const o = JSON.parse(localStorage.getItem(key) || '{}'); return Object.keys(o).filter((k) => o[k]).length; } catch (e) { return 0; }
}
let totalSolved = 0, totalAll = 0, resume = null, firstUnstarted = null;
const html = DATA.groups.map((g) => {
  const rows = g.topics.map((t) => {
    const s = Math.min(solvedCount(t.key), t.count);
    totalSolved += s; totalAll += t.count;
    const pct = t.count ? Math.round(100 * s / t.count) : 0;
    const state = s === 0 ? 'Start' : (s >= t.count ? 'Review' : 'Continue');
    if (!resume && s > 0 && s < t.count) resume = t;
    if (!firstUnstarted && s === 0) firstUnstarted = t;
    const L = t.levels;
    return '<a class="row' + (s >= t.count ? ' done' : '') + '" href="' + t.page + '.html">' +
      '<div class="t"><div class="ico"><i class="' + esc(t.icon) + '" aria-hidden="true"></i></div><div><b>' + esc(t.title) + '</b><span>' + esc(t.desc) + '</span></div></div>' +
      '<div class="lv" aria-label="Difficulty: beginner, intermediate, advanced">' +
        (L.beginner ? '<span class="chip b" title="' + L.beginner + ' beginner">' + L.beginner + '</span>' : '') +
        (L.intermediate ? '<span class="chip i" title="' + L.intermediate + ' intermediate">' + L.intermediate + '</span>' : '') +
        (L.advanced ? '<span class="chip a" title="' + L.advanced + ' advanced">' + L.advanced + '</span>' : '') + '</div>' +
      '<div class="n">' + t.count + '</div>' +
      '<div class="prog">' + s + ' / ' + t.count + ' solved<div class="bar"><i style="width:' + pct + '%"></i></div></div>' +
      '<span class="btn' + (state === 'Start' ? ' primary' : '') + '">' + state + ' <i class="fas fa-arrow-right" aria-hidden="true"></i></span></a>';
  }).join('');
  const n = g.topics.reduce((a, t) => a + t.count, 0);
  return '<section class="group"><div class="group-h"><h2>' + esc(g.name) + '</h2><span>' + esc(g.blurb) + ' · ' + n + ' challenges</span></div>' +
    '<div class="table"><div class="head"><div>Topic</div><div>Difficulty</div><div>Total</div><div>Your progress</div><div></div></div>' + rows + '</div></section>';
}).join('');
document.getElementById('groups').innerHTML = html;
document.getElementById('solved').textContent = totalSolved;
document.getElementById('overall').style.width = (totalAll ? Math.round(100 * totalSolved / totalAll) : 0) + '%';
const next = resume || firstUnstarted || DATA.groups[0].topics[0];
const cont = document.getElementById('continue');
cont.href = next.page + '.html';
cont.innerHTML = '<i class="fas fa-play" aria-hidden="true"></i> ' + (totalSolved === 0 ? 'Start practising' : (resume ? 'Continue · ' + esc(next.title) : (firstUnstarted ? 'Next · ' + esc(next.title) : 'Review')));
</script>
</body>
</html>
