<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quizzes | VibeTestQ Academy</title>
<meta name="description" content="18 self-grading quizzes covering the Playwright Mastery curriculum, with instant feedback and explanations.">
<link rel="canonical" href="https://academy.vibetestq.com/playwright/assessments/">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/assets/academy/chrome.css">
<script src="/auth-guard.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.55;padding-top:56px}
  .wrap{max-width:1040px;margin:0 auto;padding:1.6rem 1rem 3rem}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;flex-wrap:wrap;margin-bottom:1.2rem}
  .top h1{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;color:#0f172a;line-height:1.2}
  .top p{color:#64748b;font-size:.92rem;margin-top:.3rem;max-width:580px}
  .summary{display:flex;align-items:center;gap:1rem;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:.8rem 1rem;box-shadow:0 1px 4px rgba(0,0,0,.05)}
  .summary .num{font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1}
  .summary .num small{font-size:.8rem;font-weight:600;color:#64748b}
  .summary .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:#64748b;margin-top:.2rem}
  .tip{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:12px;padding:.65rem .9rem;font-size:.86rem;margin-bottom:.4rem}
  .group{margin-top:1.5rem}
  .group-h{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin:0 .25rem .55rem}
  .group-h h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:#0369a1;font-weight:800}
  .group-h span{font-size:.78rem;color:#64748b}
  .table{background:#fff;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}
  .head,.row{display:grid;grid-template-columns:minmax(0,1fr) 78px 150px 112px;align-items:center;gap:1rem;padding:.75rem 1.1rem}
  .head{background:#f8fafc;border-bottom:1px solid #e2e8f0;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:#64748b;font-weight:700}
  .row{border-bottom:1px solid #f1f5f9;text-decoration:none;color:inherit;transition:background .12s}
  .row:last-child{border-bottom:none}
  .row:hover{background:#f8fafc}
  .row.part{background:#fcfdff;padding-top:.55rem;padding-bottom:.55rem}
  .row.part .t{padding-left:2.9rem}
  .t{display:flex;align-items:center;gap:.8rem;min-width:0}
  .t>div:last-child{min-width:0}
  .ico{width:34px;height:34px;border-radius:10px;background:#e0f2fe;color:#0369a1;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.9rem}
  .row.part .ico{display:none}
  .row.part .t{gap:0}
  .t b{display:block;font-size:.93rem;color:#0f172a;font-weight:700}
  .row.part .t b{font-size:.86rem;font-weight:600;color:#334155}
  .t span{display:block;font-size:.8rem;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .n{font-size:.88rem;font-weight:700;color:#334155}
  .score{font-size:.82rem;color:#64748b}
  .score b{color:#0f172a}
  .score.good b{color:#047857}.score.mid b{color:#b45309}.score.low b{color:#be123c}
  .btn{justify-self:end;display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .8rem;border-radius:8px;border:1px solid #cbd5e1;color:#0f172a;font-size:.78rem;font-weight:700;background:#fff}
  .row:hover .btn{border-color:#0284c7;color:#0369a1}
  .btn.primary{background:#0284c7;border-color:#0284c7;color:#fff}
  .row:hover .btn.primary{background:#0369a1;color:#fff}
  .note{margin-top:1.4rem;font-size:.78rem;color:#64748b;text-align:center}
  @media(max-width:860px){
    .head{display:none}
    .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t btn" "meta meta";row-gap:.45rem}
    .row .t{grid-area:t}.row .btn{grid-area:btn}.row .n,.row .score{grid-area:meta;display:inline-block}
    .row .n{display:none}
    .t span{white-space:normal}
    .row.part .t{padding-left:1.2rem}
  }
</style>
<script defer src="/assets/academy/chrome.js"></script>
</head>
<body>
<main class="wrap" id="main">
  <div class="top">
    <div>
      <h1>Quizzes</h1>
      <p>18 self-grading quizzes with 445 questions, covering the Playwright Mastery curriculum. Take each one after its module, then review the explanations for any answer you missed.</p>
    </div>
    <div class="summary" aria-live="polite"><div><div class="num"><span id="taken">0</span> <small>/ 18 taken</small></div><div class="lbl">Your latest scores are saved here</div></div></div>
  </div>
  <div id="groups"></div>
  <p class="note">Scores are saved in this browser. You can retake any quiz.</p>
</main>
<script>
const DATA = {"groups":[{"name":"JavaScript & TypeScript","blurb":"Language fundamentals","quizzes":[{"file":"QE-Fundamentals-TypeScript.html","title":"QE Fundamentals & TypeScript","topics":"Quality Engineering, Test Pyramid, TypeScript, Functions, Debugging","questions":30,"parts":[{"file":"QE-Fundamentals-TypeScript-Part1-QE-Basics.html","title":"QE Basics - Part 1","topics":"Quality Engineering Overview, Manual vs Automation Testing, Test Automation Pyramid","questions":15},{"file":"QE-Fundamentals-TypeScript-Part2-TypeScript-Basics.html","title":"TypeScript Basics - Part 2","topics":"Environment Setup, JavaScript Fundamentals Recap, TypeScript Fundamentals","questions":15},{"file":"QE-Fundamentals-TypeScript-Part3-Advanced-TS.html","title":"Advanced TypeScript - Part 3","topics":"TypeScript Functions, Interfaces/Types/Classes, Arrays/Objects/Destructuring, VS Code Debugging","questions":15}]},{"file":"Async-JavaScript-Node.html","title":"Async JavaScript & Node.js","topics":"Async/Await, Promises, Event Loop, Node.js Modules","questions":30,"parts":[{"file":"Async-JavaScript-Node-Part1-Async-Fundamentals.html","title":"Async Fundamentals - Part 1","topics":"Synchronous vs Asynchronous Programming, Callbacks, Promises, async/await, Error Handling","questions":15},{"file":"Async-JavaScript-Node-Part2-NodeJS-Modules.html","title":"Node.js & Modules - Part 2","topics":"Node.js Fundamentals, Modules (CommonJS & ES6), File System Operations, npm Package Management, Environment Variables","questions":20}]}]},{"name":"Playwright Core","blurb":"Browser automation basics","quizzes":[{"file":"Playwright-Basics.html","title":"Playwright Basics","topics":"Test Runner, Locators, Assertions, Page Object Model, Tracing","questions":30,"parts":[{"file":"Playwright-Basics-Part1-Overview-Setup.html","title":"Playwright Overview & Setup - Part 1","topics":"Playwright Overview, Key Advantages, Architecture, Installation, Setup, async/await in Playwright","questions":15},{"file":"Playwright-Basics-Part2-Locators-Assertions.html","title":"Playwright Locators & Assertions - Part 2","topics":"Locator Strategies, Built-in Locators, CSS/XPath Selectors, Assertions, Test Structure, Debugging","questions":20}]}]},{"name":"Playwright Test","blurb":"Runner, fixtures and scenarios","quizzes":[{"file":"Advanced-Playwright.html","title":"Advanced Playwright","topics":"Configuration, Retries, Tracing, Network Mocking, Debugging","questions":30,"parts":[]},{"file":"Playwright-Advanced-Scenarios.html","title":"Playwright Advanced Scenarios","topics":"Iframes, File Handling, Dialogs, Authentication, Visual Testing","questions":30,"parts":[]}]},{"name":"API & Network","blurb":"API testing end to end","quizzes":[{"file":"Playwright-API-Testing-Fundamentals.html","title":"API Testing Fundamentals","topics":"HTTP Methods, Status Codes, Headers, Authentication","questions":30,"parts":[]},{"file":"Playwright-API-Testing.html","title":"Playwright API Testing","topics":"APIRequestContext, Requests, Assertions, Environment Config","questions":30,"parts":[]},{"file":"Advanced-Playwright-API-Testing.html","title":"Advanced API Testing","topics":"Contract Testing, Performance, Security, Resilience Patterns","questions":30,"parts":[]}]},{"name":"CI/CD, AI & Capstone","blurb":"Pipelines, AI-native testing and framework design","quizzes":[{"file":"CICD-Test-Reporting.html","title":"CI/CD & Test Reporting","topics":"CI/CD Pipelines, Test Reports, Parallelization, Artifacts","questions":30,"parts":[]},{"file":"AI-Test-Automation.html","title":"AI in Test Automation","topics":"AI Prompts, Test Data Generation, RAG, Guardrails, Security","questions":30,"parts":[]},{"file":"Framework-Design-Capstone.html","title":"Framework Design & Capstone","topics":"Framework Architecture, Page Object Model, CI Integration, Reporting","questions":30,"parts":[]}]}]};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function result(file) { try { return JSON.parse(localStorage.getItem('vtq-quiz:' + file + '.html') || 'null'); } catch (e) { return null; } }
let taken = 0;
function row(q, isPart) {
  const r = result(q.file);
  if (r && !isPart) taken++;
  let score = '<span class="score">Not taken</span>';
  if (r && r.total) {
    const pct = Math.round(100 * r.score / r.total);
    score = '<span class="score ' + (pct >= 75 ? 'good' : pct >= 50 ? 'mid' : 'low') + '">Last: <b>' + r.score + ' / ' + r.total + '</b> (' + pct + '%)</span>';
  }
  const label = r ? 'Retake' : 'Take quiz';
  return '<a class="row' + (isPart ? ' part' : '') + '" href="' + q.file + '.html">' +
    '<div class="t"><div class="ico"><i class="fas fa-clipboard-check" aria-hidden="true"></i></div><div><b>' + esc(q.title) + '</b>' + (q.topics ? '<span>' + esc(q.topics) + '</span>' : '') + '</div></div>' +
    '<div class="n">' + q.questions + '</div>' + score +
    '<span class="btn' + (r ? '' : ' primary') + '">' + label + ' <i class="fas fa-arrow-right" aria-hidden="true"></i></span></a>';
}
document.getElementById('groups').innerHTML = DATA.groups.map((g) => {
  const rows = g.quizzes.map((q) => row(q, false) + q.parts.map((p) => row(p, true)).join('')).join('');
  const n = g.quizzes.reduce((a, q) => a + 1 + q.parts.length, 0);
  return '<section class="group"><div class="group-h"><h2>' + esc(g.name) + '</h2><span>' + esc(g.blurb) + ' · ' + n + ' quizzes</span></div>' +
    '<div class="table"><div class="head"><div>Quiz</div><div>Questions</div><div>Your latest score</div><div></div></div>' + rows + '</div></section>';
}).join('');
document.getElementById('taken').textContent = taken;
</script>
</body>
</html>
