# Assessment: Playwright Basics MCQ

**Total Questions:** 30  
**Time:** 30 minutes  
**Pass Mark:** 60%  
**Topics:** Test Runner, Locators, Assertions, Page Object Model, Tracing

---

## Questions

### Question 1
Which statement best describes the Playwright test runner?

A) It is a built-in runner with fixtures, parallelism, retries, and reporting.
B) It only runs tests in headed mode.
C) It is a browser-only API with no CLI.
D) It requires a third-party runner for configuration.

**Answer: A) It is a built-in runner with fixtures, parallelism, retries, and reporting.**

**Explanation:** Playwright Test ships with its own runner and rich configuration.

---

### Question 2
What is a best practice for the Playwright test runner?

A) Launch a new browser manually in every test.
B) Use built-in fixtures like `page` and `context`.
C) Disable retries for all tests by default.
D) Avoid using `test.use()` or projects.

**Answer: B) Use built-in fixtures like `page` and `context`.**

**Explanation:** Fixtures reduce boilerplate and ensure proper cleanup.

---

### Question 3
Which pitfall should you avoid with the test runner?

A) Reusing fixtures for setup.
B) Launching browsers manually inside every test.
C) Using projects to run multiple browsers.
D) Using the built-in reporter.

**Answer: B) Launching browsers manually inside every test.**

**Explanation:** Manual launches slow tests and bypass fixture cleanup.

---

### Question 4
Which statement best describes Locators?

A) Locators are static element references resolved once.
B) Locators auto-wait and re-query the DOM for stability.
C) Locators require explicit waits for every action.
D) Locators only support CSS selectors.

**Answer: B) Locators auto-wait and re-query the DOM for stability.**

**Explanation:** Locator actions wait for elements to be actionable.

---

### Question 5
What is a best practice for Locators?

A) Prefer `getByRole` and `data-testid` for stable selectors.
B) Use `nth-child` selectors for precision.
C) Rely on long XPath chains.
D) Target CSS classes that change with styling.

**Answer: A) Prefer `getByRole` and `data-testid` for stable selectors.**

**Explanation:** Role/testid locators are resilient to UI changes.

---

### Question 6
Which pitfall should you avoid with Locators?

A) Using text or role selectors where possible.
B) Using brittle XPath or index-based selectors.
C) Combining filters like `hasText`.
D) Scoping locators to a container.

**Answer: B) Using brittle XPath or index-based selectors.**

**Explanation:** Brittle selectors increase test flakiness.

---

### Question 7
Which statement best describes Playwright assertions?

A) They are instant checks with no retry.
B) They auto-wait until the condition is met or timeout occurs.
C) They only work with page-level methods, not locators.
D) They require manual sleeps between checks.

**Answer: B) They auto-wait until the condition is met or timeout occurs.**

**Explanation:** Web-first assertions retry until success or timeout.

---

### Question 8
What is a best practice for assertions?

A) Use `expect(locator).toHaveText()` and `toBeVisible()` over manual polling.
B) Rely on `page.waitForTimeout()` before every check.
C) Assert with raw DOM APIs only.
D) Avoid locator-based assertions.

**Answer: A) Use `expect(locator).toHaveText()` and `toBeVisible()` over manual polling.**

**Explanation:** Locator assertions are resilient and auto-wait.

---

### Question 9
Which pitfall should you avoid with assertions?

A) Using `page.waitForTimeout()` instead of web-first assertions.
B) Using `expect` with locators.
C) Using toHaveText for UI copy.
D) Asserting visibility before clicking.

**Answer: A) Using `page.waitForTimeout()` instead of web-first assertions.**

**Explanation:** Fixed sleeps are flaky and slow.

---

### Question 10
Which statement best describes navigation in Playwright?

A) `page.goto()` navigates and waits for the load state by default.
B) `page.goto()` never waits for any load events.
C) Navigation must be handled with manual timeouts.
D) Playwright cannot detect SPA navigations.

**Answer: A) `page.goto()` navigates and waits for the load state by default.**

**Explanation:** Playwright waits for the default `load` state unless configured.

---

### Question 11
What is a best practice for navigation?

A) Rely on `page.waitForTimeout()` after every click.
B) Use `page.waitForURL()` or assertions for route changes when needed.
C) Avoid waiting for any navigation.
D) Use fixed sleeps to handle SPA transitions.

**Answer: B) Use `page.waitForURL()` or assertions for route changes when needed.**

**Explanation:** URL assertions are more reliable than arbitrary waits.

---

### Question 12
Which pitfall should you avoid with navigation?

A) Assuming navigation completes instantly.
B) Waiting for the expected URL.
C) Using `page.goto()` with a baseURL.
D) Verifying the page title after navigation.

**Answer: A) Assuming navigation completes instantly.**

**Explanation:** Navigation can take time; validate completion with waits/assertions.

---

### Question 13
Which statement best describes fixtures?

A) Fixtures manage setup/teardown and provide reusable test context.
B) Fixtures are only for UI tests, not API tests.
C) Fixtures are global variables for tests.
D) Fixtures replace the need for assertions.

**Answer: A) Fixtures manage setup/teardown and provide reusable test context.**

**Explanation:** Fixtures encapsulate setup and cleanup logic.

---

### Question 14
What is a best practice for fixtures?

A) Use `test.use()` for per-suite settings like storage state or baseURL.
B) Instantiate new browser servers in every test.
C) Recreate login flows in every test manually.
D) Store secrets directly in tests.

**Answer: A) Use `test.use()` for per-suite settings like storage state or baseURL.**

**Explanation:** Per-suite settings reduce duplication and speed tests.

---

### Question 15
Which pitfall should you avoid with fixtures?

A) Centralizing common setup.
B) Duplicating setup code across tests.
C) Sharing storage state in a fixture.
D) Using test hooks appropriately.

**Answer: B) Duplicating setup code across tests.**

**Explanation:** Duplication increases maintenance and inconsistency.

---

### Question 16
Which statement best describes screenshots in Playwright?

A) Screenshots are only available in headed mode.
B) Screenshots capture visual state for debugging and reports.
C) Screenshots are taken automatically for every step by default.
D) Screenshots replace assertions.

**Answer: B) Screenshots capture visual state for debugging and reports.**

**Explanation:** Artifacts help diagnose failures.

---

### Question 17
What is a best practice for screenshots?

A) Capture on failure and store in test artifacts.
B) Capture every step unconditionally.
C) Disable screenshots to speed up all suites.
D) Store screenshots in source control.

**Answer: A) Capture on failure and store in test artifacts.**

**Explanation:** Failure screenshots provide high-value debugging evidence.

---

### Question 18
Which pitfall should you avoid with screenshots?

A) Taking unnecessary screenshots for every step.
B) Capturing screenshots on failures only.
C) Attaching screenshots to reports.
D) Naming screenshot files clearly.

**Answer: A) Taking unnecessary screenshots for every step.**

**Explanation:** Excess screenshots bloat storage and slow runs.

---

### Question 19
Which statement best describes the Expect API?

A) It only works with primitive values.
B) It supports web-first assertions with automatic retries.
C) It requires manual polling loops.
D) It is not compatible with locators.

**Answer: B) It supports web-first assertions with automatic retries.**

**Explanation:** Expect retries until the assertion passes or times out.

---

### Question 20
What is a best practice for the Expect API?

A) Use web-first assertions instead of manual waits.
B) Replace all expectations with sleeps.
C) Use expect only after `waitForTimeout()`.
D) Avoid `toHaveText()` assertions.

**Answer: A) Use web-first assertions instead of manual waits.**

**Explanation:** Expect handles waiting and reduces flakiness.

---

### Question 21
Which pitfall should you avoid with the Expect API?

A) Mixing expect with custom sleep calls.
B) Using toBeVisible for UI checks.
C) Using locator-based assertions.
D) Adding custom error messages.

**Answer: A) Mixing expect with custom sleep calls.**

**Explanation:** Sleeps add latency and reduce reliability.

---

### Question 22
Which statement best describes good test structure?

A) Tests should be isolated, deterministic, and independent.
B) Tests should share state to reduce setup time.
C) Tests should rely on the order they run.
D) Tests should skip assertions when slow.

**Answer: A) Tests should be isolated, deterministic, and independent.**

**Explanation:** Isolation prevents cross-test interference.

---

### Question 23
What is a best practice for test structure?

A) Reset state and use unique data per test.
B) Reuse logged-in state without validating it.
C) Share DB records across tests.
D) Depend on previous tests for setup.

**Answer: A) Reset state and use unique data per test.**

**Explanation:** Unique data reduces collisions and flakiness.

---

### Question 24
Which pitfall should you avoid with test structure?

A) Sharing data across tests without cleanup.
B) Using beforeEach for setup.
C) Isolating side effects.
D) Cleaning up after tests.

**Answer: A) Sharing data across tests without cleanup.**

**Explanation:** Shared mutable data causes flaky failures.

---

### Question 25
Which statement best describes the Page Object Model?

A) Page objects encapsulate selectors and user actions for a page.
B) Page objects store test data and assertions only.
C) Page objects must include all test assertions.
D) Page objects replace test files entirely.

**Answer: A) Page objects encapsulate selectors and user actions for a page.**

**Explanation:** POM centralizes UI interactions and selectors.

---

### Question 26
What is a best practice for page objects?

A) Group related UI actions into methods.
B) Expose raw selectors to tests only.
C) Put test assertions inside page objects.
D) Store test data in page objects.

**Answer: A) Group related UI actions into methods.**

**Explanation:** Methods keep tests readable and reusable.

---

### Question 27
Which pitfall should you avoid with page objects?

A) Putting assertions inside page object helpers.
B) Keeping selectors private to the page object.
C) Returning locators for composability.
D) Creating small, focused page objects.

**Answer: A) Putting assertions inside page object helpers.**

**Explanation:** Assertions belong in tests; page objects handle actions.

---

### Question 28
Which statement best describes Playwright tracing?

A) Tracing only captures console logs.
B) Tracing captures steps, network, and screenshots for debugging.
C) Tracing is only available in headed mode.
D) Tracing replaces screenshots and videos.

**Answer: B) Tracing captures steps, network, and screenshots for debugging.**

**Explanation:** Traces provide a timeline of actions and artifacts.

---

### Question 29
What is a best practice for tracing?

A) Enable tracing for flaky suites or on retries.
B) Keep tracing enabled for every run.
C) Disable tracing when debugging failures.
D) Store trace files inside test source directories.

**Answer: A) Enable tracing for flaky suites or on retries.**

**Explanation:** Tracing is valuable but can be expensive.

---

### Question 30
Which pitfall should you avoid with tracing?

A) Capturing traces only on failures.
B) Leaving tracing on for every run.
C) Attaching traces to CI artifacts.
D) Using trace viewer to debug.

**Answer: B) Leaving tracing on for every run.**

**Explanation:** Always-on tracing increases storage and runtime.

---

</script>
    <script>
(() => {
    const markdownNode = document.getElementById('assessment-markdown');
    if (!markdownNode) {
        return;
    }

    const markdown = markdownNode.textContent.trim();
    const form = document.getElementById('quiz-form');
    const titleElement = document.querySelector('.assessment-title h1');
    const subtitleElement = document.querySelector('.assessment-title p');
    const scoreDisplay = document.getElementById('score-display');

    const assessmentData = parseAssessmentMarkdown(markdown);
    renderAssessment(assessmentData);

    function parseAssessmentMarkdown(raw) {
        const lines = raw.replace(/\r\n/g, '\n').split('\n');
        const titleLine = lines.find((line) => line.trim().startsWith('# ')) || '';
        const rawTitle = titleLine.replace(/^#\s*/, '').trim();
        const cleanedTitle = rawTitle
            .replace(/^Assessment\s*\d*\s*:?\s*/i, '')
            .replace(/\bMCQ\b/i, '')
            .trim();

        let topics = '';
        const topicsLine =
            lines.find((line) => /^\*\*Topics/i.test(line)) ||
            lines.find((line) => /^\*\*Topics Covered/i.test(line));
        if (topicsLine) {
            const parts = topicsLine.split(':');
            topics = parts.length > 1 ? parts.slice(1).join(':').replace(/\*\*/g, '').trim() : '';
        }

        if (!topics) {
            const subtitleLine = lines.find((line) => line.trim().startsWith('## '));
            if (subtitleLine) {
                topics = subtitleLine.replace(/^##\s*/, '').trim();
            }
        }

        const questionBlocks = [];
        const hasQuestionsHeading = lines.some((line) => /^##\s*Questions/i.test(line.trim()));
        let inQuestions = !hasQuestionsHeading;
        let stopQuestions = false;
        let current = null;

        for (const line of lines) {
            const trimmed = line.trim();

            if (/^##\s*Questions/i.test(trimmed)) {
                inQuestions = true;
                continue;
            }

            if (inQuestions && /^##\s+/i.test(trimmed) && !/^##\s*Questions/i.test(trimmed)) {
                stopQuestions = true;
                if (current) {
                    questionBlocks.push(current);
                    current = null;
                }
                continue;
            }

            if (!inQuestions || stopQuestions) {
                continue;
            }

            if (/^###\s*Question\s*\d+/i.test(trimmed)) {
                if (current) {
                    questionBlocks.push(current);
                }
                current = [];
                continue;
            }

            if (current) {
                current.push(line);
            }
        }

        if (current) {
            questionBlocks.push(current);
        }

        const questions = questionBlocks
            .map((block) => parseQuestionBlock(block))
            .filter((question) => question.options.length > 0);

        return {
            title: cleanedTitle || rawTitle || 'Assessment',
            topics,
            questions
        };
    }

    function parseQuestionBlock(lines) {
        const questionLines = [];
        const options = [];
        let answer = '';
        const explanationLines = [];
        let capturingExplanation = false;

        lines.forEach((line) => {
            const trimmed = line.trim();

            if (/^\*\*Answer:/i.test(trimmed)) {
                const match = trimmed.match(/Answer:\s*([A-D])/i);
                if (match) {
                    answer = match[1].toLowerCase();
                }
                capturingExplanation = false;
                return;
            }

            if (/^\*\*Explanation:/i.test(trimmed)) {
                capturingExplanation = true;
                const explanationText = trimmed
                    .replace(/^\*\*Explanation:\*\*\s*/i, '')
                    .replace(/^\*\*Explanation:\s*/i, '')
                    .trim();
                if (explanationText) {
                    explanationLines.push(explanationText);
                }
                return;
            }

            if (capturingExplanation) {
                if (trimmed === '---') {
                    capturingExplanation = false;
                } else {
                    explanationLines.push(line);
                }
                return;
            }

            const optionMatch = trimmed.match(/^[-*]?\s*([A-D])\)\s*(.*)$/);
            if (optionMatch) {
                options.push({
                    letter: optionMatch[1].toLowerCase(),
                    text: optionMatch[2].trim()
                });
                return;
            }

            if (trimmed === '---' || /^##/.test(trimmed)) {
                return;
            }

            questionLines.push(line);
        });

        if (!answer && options.length > 0) {
            answer = options[0].letter;
        }

        const { promptLine, bodyLines } = splitPromptAndBody(questionLines);

        return {
            promptHtml: formatInlineCode(promptLine || 'Select the correct option.'),
            bodyHtml: formatLinesToHtml(bodyLines),
            options: options.map((opt) => ({
                letter: opt.letter,
                html: formatInlineCode(opt.text)
            })),
            answer,
            explanationHtml: formatLinesToHtml(explanationLines)
        };
    }

    function splitPromptAndBody(lines) {
        let promptLine = '';
        const bodyLines = [];
        let foundPrompt = false;

        lines.forEach((line) => {
            if (!foundPrompt && line.trim() && !line.trim().startsWith('```')) {
                promptLine = line.trim();
                foundPrompt = true;
            } else {
                bodyLines.push(line);
            }
        });

        return { promptLine, bodyLines };
    }

    function formatLinesToHtml(lines) {
        if (!lines.length) {
            return '';
        }

        const parts = [];
        let inCodeBlock = false;
        let codeLines = [];
        let textLines = [];

        const flushText = () => {
            if (!textLines.length) {
                return;
            }
            parts.push(textLines.map(formatInlineCode).join('<br>'));
            textLines = [];
        };

        lines.forEach((line) => {
            const trimmed = line.trim();
            if (trimmed.startsWith('```')) {
                if (inCodeBlock) {
                    parts.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
                    codeLines = [];
                    inCodeBlock = false;
                } else {
                    flushText();
                    inCodeBlock = true;
                }
                return;
            }

            if (inCodeBlock) {
                codeLines.push(line);
            } else if (trimmed !== '') {
                textLines.push(line);
            }
        });

        if (codeLines.length) {
            parts.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
        }

        flushText();
        return parts.join('');
    }

    function formatInlineCode(text) {
        if (!text) {
            return '';
        }

        const segments = text.split('`');
        return segments
            .map((segment, index) => {
                if (index % 2 === 1) {
                    return `<code>${escapeHtml(segment)}</code>`;
                }
                return escapeHtml(segment);
            })
            .join('');
    }

    function escapeHtml(value) {
        return value
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function renderAssessment(data) {
        const heading = data.title ? `Assessment: ${data.title}` : 'Assessment';
        titleElement.textContent = heading;
        subtitleElement.textContent = data.topics || data.title || 'Multiple Choice Questions';
        document.title = `${heading} - VibeTestQ`;

        form.innerHTML = '';

        data.questions.forEach((question, index) => {
            form.appendChild(buildQuestionElement(question, index));
        });

        const submitWrap = document.createElement('div');
        submitWrap.style.textAlign = 'center';
        submitWrap.style.marginTop = '30px';
        submitWrap.innerHTML = `
            <button type="button" class="btn btn-primary" onclick="submitQuiz()">
                <i class="fas fa-paper-plane"></i> Submit Assessment
            </button>
        `;
        form.appendChild(submitWrap);

        scoreDisplay.textContent = `0 / ${data.questions.length}`;
    }

    function buildQuestionElement(question, index) {
        const questionElement = document.createElement('div');
        questionElement.className = 'question';
        questionElement.dataset.answer = question.answer;

        const questionText = document.createElement('div');
        questionText.className = 'question-text';

        const numberSpan = document.createElement('span');
        numberSpan.className = 'question-number';
        numberSpan.textContent = `${index + 1}.`;

        const textSpan = document.createElement('span');
        textSpan.innerHTML = question.promptHtml;

        questionText.appendChild(numberSpan);
        questionText.appendChild(textSpan);
        questionElement.appendChild(questionText);

        if (question.bodyHtml) {
            const body = document.createElement('div');
            body.className = 'question-body';
            body.innerHTML = question.bodyHtml;
            questionElement.appendChild(body);
        }

        const options = document.createElement('div');
        options.className = 'options';

        question.options.forEach((option) => {
            const label = document.createElement('label');
            label.className = 'option';

            const input = document.createElement('input');
            input.type = 'radio';
            input.name = `q${index + 1}`;
            input.value = option.letter;

            const optionText = document.createElement('span');
            optionText.innerHTML = option.html;

            label.appendChild(input);
            label.appendChild(optionText);
            options.appendChild(label);
        });

        questionElement.appendChild(options);

        const explanation = document.createElement('p');
        explanation.className = 'explanation';
        explanation.innerHTML = question.explanationHtml || '';
        questionElement.appendChild(explanation);

        return questionElement;
    }

    window.submitQuiz = function submitQuiz() {
        const questions = document.querySelectorAll('.question');
        let score = 0;
        const unAnsweredSet = [];

        questions.forEach((q, index) => {
            const qNum = index + 1;
            const selected = form.querySelector(`input[name="q${qNum}"]:checked`);
            if (!selected) {
                unAnsweredSet.push(q);
                q.classList.add('unanswered');
            } else {
                q.classList.remove('unanswered');
            }
        });

        if (unAnsweredSet.length > 0) {
            showToast("Please answer all questions before submitting.");
            unAnsweredSet[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
        }

        questions.forEach((q, index) => {
            const qNum = index + 1;
            const selected = form.querySelector(`input[name="q${qNum}"]:checked`);
            const correctAnswer = q.getAttribute('data-answer');
            const options = q.querySelectorAll('.option');
            const explanation = q.querySelector('.explanation');

            if (explanation) {
                explanation.style.display = 'block';
            }

            options.forEach(opt => {
                const radio = opt.querySelector('input');
                if (radio.value === correctAnswer) {
                    opt.classList.add('correct');
                }
                if (selected && radio === selected && radio.value !== correctAnswer) {
                    opt.classList.add('incorrect');
                }
            });

            if (selected && selected.value === correctAnswer) {
                score += 1;
            }
        });

        document.getElementById('result-container').style.display = 'block';
        document.getElementById('score-display').innerText = `${score} / ${questions.length}`;

        let feedback = "";
        const percentage = (score / questions.length) * 100;
        if (percentage === 100) feedback = "Perfect Score! You are a JS Wizard!";
        else if (percentage >= 80) feedback = "Excellent! You have a strong grasp of fundamentals.";
        else if (percentage >= 60) feedback = "Good job! Keep practicing to master the concepts.";
        else feedback = "Keep learning! Review the Docs to strengthen your basics.";

        document.getElementById('feedback-text').innerText = feedback;

        form.querySelectorAll('input').forEach(input => input.disabled = true);
        const submitButton = form.querySelector('button');
        if (submitButton) {
            submitButton.style.display = 'none';
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.preparePrint = function preparePrint() {
        const name = document.getElementById('student-name').value;
        if (name) {
            document.getElementById('printed-name').innerText = "Student: " + name;
        } else {
            document.getElementById('printed-name').innerText = "";
        }
        window.print();
    };

    function showToast(message) {
        let toast = document.getElementById('toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'toast';
            toast.className = 'toast';
            document.body.appendChild(toast);
        }
        toast.innerText = message;
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 3000);
    }
})();
    </script>
