.btn-primary {

}

.score-display {
    font-size: 3rem;

}

.feedback-text {

}

.name-input-section {
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
}

.name-input-section label {
    display: block;
    margin-bottom: 10px;

.name-input-section input {

    border-radius: 6px;

    margin-bottom: 15px;

    border-radius: 8px;

    <script type="text/plain" id="assessment-markdown">
# Assessment: Advanced TypeScript - Part 3

**Total Questions:** 15  
**Time:** 15 minutes  
**Pass Mark:** 60%  
**Topics:** TypeScript Functions, Interfaces/Types/Classes, Arrays/Objects/Destructuring, VS Code Debugging

---

## Questions

### Question 1
What is the purpose of an interface in TypeScript?

A) To define the shape of an object
B) To create runtime classes
C) To improve performance
D) To replace functions

**Answer: A) To define the shape of an object**

**Explanation:** Interfaces define the structure or shape of objects, ensuring type safety without affecting runtime behavior.

---

### Question 2
How do you define a class in TypeScript?

A) interface MyClass {}
B) class MyClass {}
C) type MyClass = {}
D) function MyClass() {}

**Answer: B) class MyClass {}**

**Explanation:** Classes are defined using the `class` keyword and can include properties, methods, and constructors.

---

### Question 3
What does the `readonly` keyword do in TypeScript?

A) Makes variables faster
B) Prevents modification after initialization
C) Hides the property
D) Makes the property optional

**Answer: B) Prevents modification after initialization**

**Explanation:** `readonly` prevents reassignment of a property after it's been set during initialization.

---

### Question 4
What is array destructuring?

A) Deleting array elements
B) Extracting values from arrays into variables
C) Creating empty arrays
D) Sorting arrays

**Answer: B) Extracting values from arrays into variables**

**Explanation:** Destructuring extracts values from arrays or objects into distinct variables in a concise way.

---

### Question 5
How do you destructure the first two elements of an array?

A) const [a, b] = arr
B) const {a, b} = arr
C) const a, b = arr
D) const arr[a, b]

**Answer: A) const [a, b] = arr**

**Explanation:** Array destructuring uses square brackets to extract values by position.

---

### Question 6
What is object destructuring useful for?

A) Deleting object properties
B) Extracting specific properties into variables
C) Creating new objects
D) Sorting object keys

**Answer: B) Extracting specific properties into variables**

**Explanation:** Object destructuring simplifies accessing and assigning object properties to variables.

---

### Question 7
What is a type alias in TypeScript?

A) A new name for an existing type
B) A runtime function
C) A class inheritance
D) A compiler flag

**Answer: A) A new name for an existing type**

**Explanation:** Type aliases create custom names for types using the `type` keyword, improving code readability.

---

### Question 8
How do you define a union type?

A) type ID = string & number
B) type ID = string | number
C) type ID = string + number
D) type ID = string, number

**Answer: B) type ID = string | number**

**Explanation:** Union types use `|` to allow a value to be one of several types.

---

### Question 9
What is the spread operator used for with arrays?

A) To delete elements
B) To copy or merge arrays
C) To sort arrays
D) To reverse arrays

**Answer: B) To copy or merge arrays**

**Explanation:** The spread operator (`...`) expands array elements, useful for copying or merging arrays.

---

### Question 10
How do you set a breakpoint in VS Code?

A) Right-click the line number
B) Press F5
C) Click in the gutter left of the line number
D) Type "break" in code

**Answer: C) Click in the gutter left of the line number**

**Explanation:** Clicking in the gutter (left margin) next to the line number sets a breakpoint for debugging.

---

### Question 11
What does F5 do in VS Code debugging?

A) Stops debugging
B) Starts or continues debugging
C) Steps over a line
D) Restarts the file

**Answer: B) Starts or continues debugging**

**Explanation:** F5 starts the debugger or continues execution to the next breakpoint.

---

### Question 12
What is the Watch panel used for in VS Code?

A) Monitoring variable values during debugging
B) Watching file changes
C) Viewing console logs
D) Tracking network requests

**Answer: A) Monitoring variable values during debugging**

**Explanation:** The Watch panel lets you track specific variables or expressions during debugging.

---

### Question 13
What is an intersection type?

A) type Combined = A | B
B) type Combined = A & B
C) type Combined = A + B
D) type Combined = A, B

**Answer: B) type Combined = A & B**

**Explanation:** Intersection types combine multiple types using `&`, requiring the value to satisfy all types.

---

### Question 14
How do you make all properties of an interface optional?

A) Use Partial<Interface>
B) Use Optional<Interface>
C) Add ? to each property
D) Use interface?

**Answer: A) Use Partial<Interface>**

**Explanation:** `Partial<T>` is a utility type that makes all properties of type T optional.

---

### Question 15
What does "Step Over" (F10) do during debugging?

A) Executes the current line and moves to the next
B) Steps into function calls
C) Stops debugging
D) Restarts from beginning

**Answer: A) Executes the current line and moves to the next**

**Explanation:** Step Over executes the line without entering function calls, useful for high-level debugging.

---

    <script>
(() => {
    const markdownNode = document.getElementById('assessment-markdown');
    if (!markdownNode) {
        return;
    }

    const markdown = markdownNode.textContent.trim();
    const form = document.getElementById('quiz-form');
    const titleElement = document.querySelector('.assessment-title h1');
    const subtitleElement = document.querySelector('.assessment-title p');
    const scoreDisplay = document.getElementById('score-display');

    const assessmentData = parseAssessmentMarkdown(markdown);
    renderAssessment(assessmentData);

    function parseAssessmentMarkdown(raw) {
        const lines = raw.replace(/\r\n/g, '\n').split('\n');
        const titleLine = lines.find((line) => line.trim().startsWith('# ')) || '';
        const rawTitle = titleLine.replace(/^#\s*/, '').trim();
        const cleanedTitle = rawTitle
            .replace(/^Assessment\s*\d*\s*:?\s*/i, '')
            .replace(/\bMCQ\b/i, '')
            .trim();

        let topics = '';
        const topicsLine =
            lines.find((line) => /^\*\*Topics/i.test(line)) ||
            lines.find((line) => /^\*\*Topics Covered/i.test(line));
        if (topicsLine) {
            const parts = topicsLine.split(':');
            topics = parts.length > 1 ? parts.slice(1).join(':').replace(/\*\*/g, '').trim() : '';
        }

        if (!topics) {
            const subtitleLine = lines.find((line) => line.trim().startsWith('## '));
            if (subtitleLine) {
                topics = subtitleLine.replace(/^##\s*/, '').trim();
            }
        }

        const questionBlocks = [];
        const hasQuestionsHeading = lines.some((line) => /^##\s*Questions/i.test(line.trim()));
        let inQuestions = !hasQuestionsHeading;
        let stopQuestions = false;
        let current = null;

        for (const line of lines) {
            const trimmed = line.trim();

            if (/^##\s*Questions/i.test(trimmed)) {
                inQuestions = true;
                continue;
            }

            if (inQuestions && /^##\s+/i.test(trimmed) && !/^##\s*Questions/i.test(trimmed)) {
                stopQuestions = true;
                if (current) {
                    questionBlocks.push(current);
                    current = null;
                }
                continue;
            }

            if (!inQuestions || stopQuestions) {
                continue;
            }

            if (/^###\s*Question\s*\d+/i.test(trimmed)) {
                if (current) {
                    questionBlocks.push(current);
                }
                current = [];
                continue;
            }

            if (current) {
                current.push(line);
            }
        }

        if (current) {
            questionBlocks.push(current);
        }

        const questions = questionBlocks
            .map((block) => parseQuestionBlock(block))
            .filter((question) => question.options.length > 0);

        return {
            title: cleanedTitle || rawTitle || 'Assessment',
            topics,
            questions
        };
    }

    function parseQuestionBlock(lines) {
        const questionLines = [];
        const options = [];
        let answer = '';
        const explanationLines = [];
        let capturingExplanation = false;

        lines.forEach((line) => {
            const trimmed = line.trim();

            if (/^\*\*Answer:/i.test(trimmed)) {
                const match = trimmed.match(/Answer:\s*([A-D])/i);
                if (match) {
                    answer = match[1].toLowerCase();
                }
                capturingExplanation = false;
                return;
            }

            if (/^\*\*Explanation:/i.test(trimmed)) {
                capturingExplanation = true;
                const expText = trimmed.replace(/^\*\*Explanation:\s*/i, '').replace(/\*\*/g, '');
                if (expText) {
                    explanationLines.push(expText);
                }
                return;
            }

            if (capturingExplanation) {
                if (trimmed && !trimmed.startsWith('---')) {
                    explanationLines.push(trimmed);
                } else {
                    capturingExplanation = false;
                }
                return;
            }

            const optMatch = trimmed.match(/^([A-D])\)\s*(.+)$/);
            if (optMatch) {
                const optLetter = optMatch[1].toLowerCase();
                const optText = optMatch[2].trim();
                options.push({ id: optLetter, text: optText });
                return;
            }

            if (trimmed && !trimmed.startsWith('---') && !trimmed.startsWith('**')) {
                questionLines.push(trimmed);
            }
        });

        return {
            question: questionLines.join(' ').trim(),
            options,
            answer,
            explanation: explanationLines.join(' ').trim()
        };
    }

    function renderAssessment(data) {
        titleElement.textContent = data.title;
        subtitleElement.textContent = data.topics || 'Professional Automation Training';

        let html = '';
        data.questions.forEach((q, idx) => {
            html += '<div class="question" data-question="' + idx + '">';
            html += '<div class="question-text">';
            html += '<span class="question-number">Q' + (idx + 1) + '.</span>';
            html += '<span>' + q.question + '</span>';
            html += '</div>';
            html += '<div class="options">';
            q.options.forEach((opt) => {
                html += '<label class="option">';
                html +=
                    '<input type="radio" name="q' +
                    idx +
                    '" value="' +
                    opt.id +
                    '" data-question="' +
                    idx +
                    '">';
                html += '<span>' + opt.id.toUpperCase() + ') ' + opt.text + '</span>';
                html += '</label>';
            });
            html += '</div>';
            if (q.explanation) {
                html += '<div class="explanation">' + q.explanation + '</div>';
            }
            html += '</div>';
        });

        form.innerHTML = html;

        const submitBtn = document.createElement('div');
        submitBtn.style.textAlign = 'center';
        submitBtn.style.marginTop = '30px';
        submitBtn.innerHTML =
            '<button type="button" class="btn btn-primary" onclick="submitQuiz()"><i class="fas fa-paper-plane"></i> Submit Assessment</button>';
        form.appendChild(submitBtn);

        window.assessmentData = data;
    }

    window.submitQuiz = function () {
        const questions = document.querySelectorAll('.question');
        let score = 0;
        let unanswered = [];

        questions.forEach((q, idx) => {
            q.classList.remove('unanswered');
            const selected = q.querySelector('input[type="radio"]:checked');
            const correctAnswer = window.assessmentData.questions[idx].answer;

            if (!selected) {
                unanswered.push(idx + 1);
                q.classList.add('unanswered');
                return;
            }

            const options = q.querySelectorAll('.option');
            options.forEach((opt) => {
                const radio = opt.querySelector('input[type="radio"]');
                if (radio.value === correctAnswer) {
                    opt.classList.add('correct');
                }
                if (selected && radio === selected && radio.value !== correctAnswer) {
                    opt.classList.add('incorrect');
                }
            });

            if (selected.value === correctAnswer) {
                score += 1;
            }

            const explanation = q.querySelector('.explanation');
            if (explanation) {
                explanation.style.display = 'block';
            }
        });

        if (unanswered.length > 0) {
            alert('Please answer all questions before submitting. Unanswered: Q' + unanswered.join(', Q'));
            return;
        }

        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('result-container').style.display = 'block';
        document.getElementById('score-display').innerText = score + ' / ' + window.assessmentData.questions.length;

        const percentage = (score / window.assessmentData.questions.length) * 100;
        let feedback = '';
        if (percentage === 100) feedback = 'Perfect Score! Outstanding work!';
        else if (percentage >= 80) feedback = 'Excellent! You have a strong understanding.';
        else if (percentage >= 60) feedback = 'Good job! You passed the assessment.';
        else feedback = 'Keep practicing. Review the topics and try again.';

        document.getElementById('feedback-text').innerText = feedback;
    };

    window.preparePrint = function () {
        const name = document.getElementById('student-name').value.trim();
        if (!name) {
            alert('Please enter your name before printing.');
            return;
        }
        document.getElementById('printed-name').textContent = 'Student: ' + name;
        window.print();
    };
})();
    </script>
