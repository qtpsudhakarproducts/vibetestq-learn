    <script type="text/plain" id="assessment-markdown">
# Assessment: Async Fundamentals - Part 1

**Total Questions:** 15  
**Time:** 15 minutes  
**Pass Mark:** 60%  
**Topics:** Synchronous vs Asynchronous Programming, Callbacks, Promises, async/await, Error Handling

---

## Questions

### Question 1
What is synchronous programming?

A) Code executes line by line, waiting for each operation to complete
B) Multiple operations run simultaneously
C) Code runs in random order
D) Operations complete instantly

**Answer: A) Code executes line by line, waiting for each operation to complete**

**Explanation:** Synchronous code is blocking - each operation must finish before the next one starts.

---

### Question 2
What is the main advantage of asynchronous programming?

A) Simpler code
B) Non-blocking operations allowing other code to run
C) Faster CPU operations
D) Automatic error handling

**Answer: B) Non-blocking operations allowing other code to run**

**Explanation:** Async programming allows long-running operations (like API calls) to proceed without blocking other code.

---

### Question 3
What is the event loop in JavaScript?

A) A loop that creates events
B) A mechanism that handles asynchronous operations
C) A debugging tool
D) A type of callback

**Answer: B) A mechanism that handles asynchronous operations**

**Explanation:** The event loop manages the execution of code, collecting and processing events, and executing queued tasks.

---

### Question 4
What is callback hell?

A) A syntax error
B) Deeply nested callbacks that are hard to read and maintain
C) An error in the event loop
D) A type of promise rejection

**Answer: B) Deeply nested callbacks that are hard to read and maintain**

**Explanation:** Callback hell refers to multiple nested callbacks, creating a "pyramid of doom" that's difficult to read and debug.

---

### Question 5
What is a Promise in JavaScript?

A) A guarantee that code will never fail
B) An object representing the eventual completion or failure of an async operation
C) A type of callback
D) A synchronous function

**Answer: B) An object representing the eventual completion or failure of an async operation**

**Explanation:** Promises represent a value that may be available now, later, or never, with states: pending, fulfilled, or rejected.

---

### Question 6
What are the three states of a Promise?

A) start, middle, end
B) pending, fulfilled, rejected
C) waiting, done, error
D) init, running, complete

**Answer: B) pending, fulfilled, rejected**

**Explanation:** A Promise is pending initially, then either fulfilled (resolved) with a value or rejected with an error.

---

### Question 7
How do you handle a Promise's successful result?

A) .catch()
B) .then()
C) .finally()
D) .done()

**Answer: B) .then()**

**Explanation:** The `.then()` method handles the resolved value when a Promise is fulfilled.

---

### Question 8
What does the async keyword do?

A) Makes code run faster
B) Makes a function return a Promise
C) Blocks all other code
D) Handles errors automatically

**Answer: B) Makes a function return a Promise**

**Explanation:** `async` functions always return a Promise, wrapping non-Promise return values automatically.

---

### Question 9
What does the await keyword do?

A) Pauses execution until the Promise resolves
B) Creates a new Promise
C) Handles errors
D) Makes code synchronous

**Answer: A) Pauses execution until the Promise resolves**

**Explanation:** `await` pauses the async function until the Promise settles, then resumes with the resolved value.

---

### Question 10
Can await be used outside of an async function?

A) Yes, anywhere
B) No, only inside async functions (or top-level in modules)
C) Only in classes
D) Only in arrow functions

**Answer: B) No, only inside async functions (or top-level in modules)**

**Explanation:** `await` is only valid inside async functions, except for top-level await in ES modules.

---

### Question 11
How do you handle errors with async/await?

A) .catch() only
B) try/catch blocks
C) .error() method
D) Errors are ignored

**Answer: B) try/catch blocks**

**Explanation:** With async/await, use try/catch blocks to handle errors from awaited Promises.

---

### Question 12
What does .catch() do on a Promise chain?

A) Creates a new Promise
B) Handles rejected Promises (errors)
C) Stops all code execution
D) Retries the operation

**Answer: B) Handles rejected Promises (errors)**

**Explanation:** `.catch()` catches errors from any preceding Promise in the chain.

---

### Question 13
What happens if you don't handle a Promise rejection?

A) Code stops completely
B) Unhandled Promise rejection warning/error
C) Promise automatically retries
D) Error is silently ignored

**Answer: B) Unhandled Promise rejection warning/error**

**Explanation:** Unhandled rejections trigger warnings and can crash Node.js applications in strict mode.

---

### Question 14
What does Promise.all() do?

A) Runs Promises sequentially
B) Runs multiple Promises in parallel, resolves when all complete
C) Picks the fastest Promise
D) Cancels all Promises

**Answer: B) Runs multiple Promises in parallel, resolves when all complete**

**Explanation:** `Promise.all()` waits for all Promises to resolve or rejects if any Promise rejects.

---

### Question 15
What is the difference between .then() chaining and async/await?

A) No difference, just syntax
B) async/await is more readable and uses try/catch for errors
C) .then() is faster
D) async/await doesn't support Promises

**Answer: B) async/await is more readable and uses try/catch for errors**

**Explanation:** async/await provides cleaner, more synchronous-looking code while handling Promises under the hood.

    <script>
(() => {
    const markdownNode = document.getElementById('assessment-markdown');
    if (!markdownNode) {
        return;
    }

    const markdown = markdownNode.textContent.trim();
    const form = document.getElementById('quiz-form');
    const titleElement = document.querySelector('.assessment-title h1');
    const subtitleElement = document.querySelector('.assessment-title p');
    const scoreDisplay = document.getElementById('score-display');

    const assessmentData = parseAssessmentMarkdown(markdown);
    renderAssessment(assessmentData);

    function parseAssessmentMarkdown(raw) {
        const lines = raw.replace(/\r\n/g, '\n').split('\n');
        const titleLine = lines.find((line) => line.trim().startsWith('# ')) || '';
        const rawTitle = titleLine.replace(/^#\s*/, '').trim();
        const cleanedTitle = rawTitle
            .replace(/^Assessment\s*\d*\s*:?\s*/i, '')
            .replace(/\bMCQ\b/i, '')
            .trim();

        let topics = '';
        const topicsLine =
            lines.find((line) => /^\*\*Topics/i.test(line)) ||
            lines.find((line) => /^\*\*Topics Covered/i.test(line));
        if (topicsLine) {
            const parts = topicsLine.split(':');
            topics = parts.length > 1 ? parts.slice(1).join(':').replace(/\*\*/g, '').trim() : '';
        }

        if (!topics) {
            const subtitleLine = lines.find((line) => line.trim().startsWith('## '));
            if (subtitleLine) {
                topics = subtitleLine.replace(/^##\s*/, '').trim();
            }
        }

        const questionBlocks = [];
        const hasQuestionsHeading = lines.some((line) => /^##\s*Questions/i.test(line.trim()));
        let inQuestions = !hasQuestionsHeading;
        let stopQuestions = false;
        let current = null;

        for (const line of lines) {
            const trimmed = line.trim();

            if (/^##\s*Questions/i.test(trimmed)) {
                inQuestions = true;
                continue;
            }

            if (inQuestions && /^##\s+/i.test(trimmed) && !/^##\s*Questions/i.test(trimmed)) {
                stopQuestions = true;
                if (current) {
                    questionBlocks.push(current);
                    current = null;
                }
                continue;
            }

            if (!inQuestions || stopQuestions) {
                continue;
            }

            if (/^###\s*Question\s*\d+/i.test(trimmed)) {
                if (current) {
                    questionBlocks.push(current);
                }
                current = [];
                continue;
            }

            if (current) {
                current.push(line);
            }
        }

        if (current) {
            questionBlocks.push(current);
        }

        const questions = questionBlocks
            .map((block) => parseQuestionBlock(block))
            .filter((question) => question.options.length > 0);

        return {
            title: cleanedTitle || rawTitle || 'Assessment',
            topics,
            questions
        };
    }

    function parseQuestionBlock(lines) {
        const questionLines = [];
        const options = [];
        let answer = '';
        const explanationLines = [];
        let capturingExplanation = false;

        lines.forEach((line) => {
            const trimmed = line.trim();

            if (/^\*\*Answer:/i.test(trimmed)) {
                const match = trimmed.match(/Answer:\s*([A-D])/i);
                if (match) {
                    answer = match[1].toLowerCase();
                }
                capturingExplanation = false;
                return;
            }

            if (/^\*\*Explanation:/i.test(trimmed)) {
                capturingExplanation = true;
                const expText = trimmed.replace(/^\*\*Explanation:\s*/i, '').replace(/\*\*/g, '');
                if (expText) {
                    explanationLines.push(expText);
                }
                return;
            }

            if (capturingExplanation) {
                if (trimmed && !trimmed.startsWith('---')) {
                    explanationLines.push(trimmed);
                } else {
                    capturingExplanation = false;
                }
                return;
            }

            const optMatch = trimmed.match(/^([A-D])\)\s*(.+)$/);
            if (optMatch) {
                const optLetter = optMatch[1].toLowerCase();
                const optText = optMatch[2].trim();
                options.push({ id: optLetter, text: optText });
                return;
            }

            if (trimmed && !trimmed.startsWith('---') && !trimmed.startsWith('**')) {
                questionLines.push(trimmed);
            }
        });

        return {
            question: questionLines.join(' ').trim(),
            options,
            answer,
            explanation: explanationLines.join(' ').trim()
        };
    }

    function renderAssessment(data) {
        titleElement.textContent = data.title;
        subtitleElement.textContent = data.topics || 'Professional Automation Training';

        let html = '';
        data.questions.forEach((q, idx) => {
            html += '<div class="question" data-question="' + idx + '">';
            html += '<div class="question-text">';
            html += '<span class="question-number">Q' + (idx + 1) + '.</span>';
            html += '<span>' + q.question + '</span>';
            html += '</div>';
            html += '<div class="options">';
            q.options.forEach((opt) => {
                html += '<label class="option">';
                html +=
                    '<input type="radio" name="q' +
                    idx +
                    '" value="' +
                    opt.id +
                    '" data-question="' +
                    idx +
                    '">';
                html += '<span>' + opt.id.toUpperCase() + ') ' + opt.text + '</span>';
                html += '</label>';
            });
            html += '</div>';
            if (q.explanation) {
                html += '<div class="explanation">' + q.explanation + '</div>';
            }
            html += '</div>';
        });

        form.innerHTML = html;

        const submitBtn = document.createElement('div');
        submitBtn.style.textAlign = 'center';
        submitBtn.style.marginTop = '30px';
        submitBtn.innerHTML =
            '<button type="button" class="btn btn-primary" onclick="submitQuiz()"><i class="fas fa-paper-plane"></i> Submit Assessment</button>';
        form.appendChild(submitBtn);

        window.assessmentData = data;
    }

    window.submitQuiz = function () {
        const questions = document.querySelectorAll('.question');
        let score = 0;
        let unanswered = [];

        questions.forEach((q, idx) => {
            q.classList.remove('unanswered');
            const selected = q.querySelector('input[type="radio"]:checked');
            const correctAnswer = window.assessmentData.questions[idx].answer;

            if (!selected) {
                unanswered.push(idx + 1);
                q.classList.add('unanswered');
                return;
            }

            const options = q.querySelectorAll('.option');
            options.forEach((opt) => {
                const radio = opt.querySelector('input[type="radio"]');
                if (radio.value === correctAnswer) {
                    opt.classList.add('correct');
                }
                if (selected && radio === selected && radio.value !== correctAnswer) {
                    opt.classList.add('incorrect');
                }
            });

            if (selected.value === correctAnswer) {
                score += 1;
            }

            const explanation = q.querySelector('.explanation');
            if (explanation) {
                explanation.style.display = 'block';
            }
        });

        if (unanswered.length > 0) {
            alert('Please answer all questions before submitting. Unanswered: Q' + unanswered.join(', Q'));
            return;
        }

        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('result-container').style.display = 'block';
        document.getElementById('score-display').innerText = score + ' / ' + window.assessmentData.questions.length;

        const percentage = (score / window.assessmentData.questions.length) * 100;
        let feedback = '';
        if (percentage === 100) feedback = 'Perfect Score! Outstanding work!';
        else if (percentage >= 80) feedback = 'Excellent! You have a strong understanding.';
        else if (percentage >= 60) feedback = 'Good job! You passed the assessment.';
        else feedback = 'Keep practicing. Review the topics and try again.';

        document.getElementById('feedback-text').innerText = feedback;
    };

    window.preparePrint = function () {
        const name = document.getElementById('student-name').value.trim();
        if (!name) {
            alert('Please enter your name before printing.');
            return;
        }
        document.getElementById('printed-name').textContent = 'Student: ' + name;
        window.print();
    };
})();
    </script>
