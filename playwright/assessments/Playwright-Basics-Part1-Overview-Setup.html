.btn-primary:hover {

        opacity: 1;
        transform: translateY(0);

}

.score-display {
    font-size: 3rem;

    margin: 20px 0;
}

.feedback-text {
    font-size: 1.2rem;

}

.name-input-section {

    padding-top: 20px;
    border-top: 1px solid var(--border);
}

.name-input-section label {
    display: block;
    margin-bottom: 10px;

    margin-bottom: 15px;

    <script type="text/plain" id="assessment-markdown">
# Assessment: Playwright Overview & Setup - Part 1

**Total Questions:** 15
**Time:** 15 minutes
**Pass Mark:** 60%
**Topics:** Playwright Overview, Key Advantages, Architecture, Installation, Setup, async/await in Playwright

---

## Questions

### Question 1
Who developed Playwright?

A) Google
B) Microsoft
C) Meta
D) Amazon

**Answer: B) Microsoft**

**Explanation:** Playwright is an open-source automation framework developed by Microsoft.

---

### Question 2
Which browsers does Playwright support?

A) Only Chrome
B) Chromium, Firefox, and WebKit
C) Only Firefox and Chrome
D) Only Safari

**Answer: B) Chromium, Firefox, and WebKit**

**Explanation:** Playwright supports all major browser engines: Chromium (Chrome/Edge), Firefox, and WebKit (Safari).

---

### Question 3
What is one of Playwright's key features that reduces flaky tests?

A) Manual waiting
B) Auto-waiting
C) Random delays
D) No waiting

**Answer: B) Auto-waiting**

**Explanation:** Playwright automatically waits for elements to be ready before performing actions.

---

### Question 4
What is a Browser Context in Playwright?

A) The browser window
B) An isolated browser session like incognito mode
C) A JavaScript variable
D) A test file

**Answer: B) An isolated browser session like incognito mode**

**Explanation:** Browser contexts provide isolated sessions with independent cookies, storage, and cache.

---

### Question 5
What command initializes a new Playwright project?

A) npm install playwright
B) npm init playwright@latest
C) npx create-playwright
D) playwright init

**Answer: B) npm init playwright@latest**

**Explanation:** `npm init playwright@latest` initializes a new Playwright project with configuration.

---

### Question 6
What is the main configuration file for Playwright?

A) package.json
B) tsconfig.json
C) playwright.config.ts
D) test.config.js

**Answer: C) playwright.config.ts**

**Explanation:** playwright.config.ts contains all Playwright test configuration options.

---

### Question 7
What command installs all Playwright browsers?

A) npm install browsers
B) npx playwright install
C) playwright setup
D) npm run install-browsers

**Answer: B) npx playwright install**

**Explanation:** `npx playwright install` downloads and installs all supported browsers.

---

### Question 8
Why must you use await with Playwright actions?

A) To make code look better
B) Because browser operations are asynchronous
C) It's optional
D) To handle errors

**Answer: B) Because browser operations are asynchronous**

**Explanation:** Browser operations take time, so Playwright actions return Promises that must be awaited.

---

### Question 9
What happens if you forget to use await with a Playwright action?

A) Nothing, it works fine
B) The action may execute before the previous one completes
C) A syntax error occurs
D) The browser crashes

**Answer: B) The action may execute before the previous one completes**

**Explanation:** Without await, code continues without waiting for the action to complete.

---

### Question 10
What does Playwright auto-wait for before clicking an element?

A) Nothing
B) Element to be attached, visible, stable, and enabled
C) Only visibility
D) Only element to exist

**Answer: B) Element to be attached, visible, stable, and enabled**

**Explanation:** Playwright waits for multiple conditions to ensure reliable interactions.

---

### Question 11
Which VS Code extension enhances Playwright development?

A) ESLint
B) Prettier
C) Playwright Test for VSCode
D) GitLens

**Answer: C) Playwright Test for VSCode**

**Explanation:** Playwright Test for VSCode provides features like running tests, debugging, and generating locators.

---

### Question 12
What is the recommended Node.js version for Playwright?

A) Node.js 10+
B) Node.js 14+
C) Node.js 18+
D) Node.js 20+

**Answer: C) Node.js 18+**

**Explanation:** Playwright requires Node.js 18 or higher for full feature support.

---

### Question 13
In Playwright architecture, what communicates between test code and the browser?

A) HTTP requests
B) WebSocket/CDP (Chrome DevTools Protocol)
C) Direct memory access
D) File system

**Answer: B) WebSocket/CDP (Chrome DevTools Protocol)**

**Explanation:** Playwright uses WebSocket and CDP for out-of-process browser communication.

---

### Question 14
What advantage does Playwright's out-of-process architecture provide?

A) Slower execution
B) Better stability and error recovery
C) Less features
D) Requires more memory

**Answer: B) Better stability and error recovery**

**Explanation:** Running outside the browser process provides stability and network interception capabilities.

---

### Question 15
What does the `baseURL` configuration option do?

A) Sets the browser name
B) Sets the default URL for page.goto() calls
C) Sets the API endpoint
D) Sets the report location

**Answer: B) Sets the default URL for page.goto() calls**

**Explanation:** baseURL allows you to use relative URLs in your tests instead of full URLs.

---

    <script>
(() => {
    const markdownNode = document.getElementById('assessment-markdown');
    if (!markdownNode) {
        return;
    }

    const markdown = markdownNode.textContent.trim();
    const form = document.getElementById('quiz-form');
    const titleElement = document.querySelector('.assessment-title h1');
    const subtitleElement = document.querySelector('.assessment-title p');
    const scoreDisplay = document.getElementById('score-display');

    const assessmentData = parseAssessmentMarkdown(markdown);
    renderAssessment(assessmentData);

    function parseAssessmentMarkdown(raw) {
        const lines = raw.replace(/\r\n/g, '\n').split('\n');
        const titleLine = lines.find((line) => line.trim().startsWith('# ')) || '';
        const rawTitle = titleLine.replace(/^#\s*/, '').trim();
        const cleanedTitle = rawTitle
            .replace(/^Assessment\s*\d*\s*:?\s*/i, '')
            .replace(/\bMCQ\b/i, '')
            .trim();

        let topics = '';
        const topicsLine =
            lines.find((line) => /^\*\*Topics/i.test(line)) ||
            lines.find((line) => /^\*\*Topics Covered/i.test(line));
        if (topicsLine) {
            const parts = topicsLine.split(':');
            topics = parts.length > 1 ? parts.slice(1).join(':').replace(/\*\*/g, '').trim() : '';
        }

        if (!topics) {
            const subtitleLine = lines.find((line) => line.trim().startsWith('## '));
            if (subtitleLine) {
                topics = subtitleLine.replace(/^##\s*/, '').trim();
            }
        }

        const questionBlocks = [];
        const hasQuestionsHeading = lines.some((line) => /^##\s*Questions/i.test(line.trim()));
        let inQuestions = !hasQuestionsHeading;
        let stopQuestions = false;
        let current = null;

        for (const line of lines) {
            const trimmed = line.trim();

            if (/^##\s*Questions/i.test(trimmed)) {
                inQuestions = true;
                continue;
            }

            if (inQuestions && /^##\s+/i.test(trimmed) && !/^##\s*Questions/i.test(trimmed)) {
                stopQuestions = true;
                if (current) {
                    questionBlocks.push(current);
                    current = null;
                }
                continue;
            }

            if (!inQuestions || stopQuestions) {
                continue;
            }

            if (/^###\s*Question\s*\d+/i.test(trimmed)) {
                if (current) {
                    questionBlocks.push(current);
                }
                current = [];
                continue;
            }

            if (current) {
                current.push(line);
            }
        }

        if (current) {
            questionBlocks.push(current);
        }

        const questions = questionBlocks
            .map((block) => parseQuestionBlock(block))
            .filter((question) => question.options.length > 0);

        return {
            title: cleanedTitle || rawTitle || 'Assessment',
            topics,
            questions
        };
    }

    function parseQuestionBlock(lines) {
        const questionLines = [];
        const options = [];
        let answer = '';
        const explanationLines = [];
        let capturingExplanation = false;

        lines.forEach((line) => {
            const trimmed = line.trim();

            if (/^\*\*Answer:/i.test(trimmed)) {
                const match = trimmed.match(/Answer:\s*([A-D])/i);
                if (match) {
                    answer = match[1].toLowerCase();
                }
                capturingExplanation = false;
                return;
            }

            if (/^\*\*Explanation:/i.test(trimmed)) {
                capturingExplanation = true;
                const expText = trimmed.replace(/^\*\*Explanation:\s*/i, '').replace(/\*\*/g, '');
                if (expText) {
                    explanationLines.push(expText);
                }
                return;
            }

            if (capturingExplanation) {
                if (trimmed && !trimmed.startsWith('---')) {
                    explanationLines.push(trimmed);
                } else {
                    capturingExplanation = false;
                }
                return;
            }

            const optMatch = trimmed.match(/^([A-D])\)\s*(.+)$/);
            if (optMatch) {
                const optLetter = optMatch[1].toLowerCase();
                const optText = optMatch[2].trim();
                options.push({ id: optLetter, text: optText });
                return;
            }

            if (trimmed && !trimmed.startsWith('---') && !trimmed.startsWith('**')) {
                questionLines.push(trimmed);
            }
        });

        return {
            question: questionLines.join(' ').trim(),
            options,
            answer,
            explanation: explanationLines.join(' ').trim()
        };
    }

    function renderAssessment(data) {
        titleElement.textContent = data.title;
        subtitleElement.textContent = data.topics || 'Professional Automation Training';

        let html = '';
        data.questions.forEach((q, idx) => {
            html += '<div class="question" data-question="' + idx + '">';
            html += '<div class="question-text">';
            html += '<span class="question-number">Q' + (idx + 1) + '.</span>';
            html += '<span>' + q.question + '</span>';
            html += '</div>';
            html += '<div class="options">';
            q.options.forEach((opt) => {
                html += '<label class="option">';
                html +=
                    '<input type="radio" name="q' +
                    idx +
                    '" value="' +
                    opt.id +
                    '" data-question="' +
                    idx +
                    '">';
                html += '<span>' + opt.id.toUpperCase() + ') ' + opt.text + '</span>';
                html += '</label>';
            });
            html += '</div>';
            if (q.explanation) {
                html += '<div class="explanation">' + q.explanation + '</div>';
            }
            html += '</div>';
        });

        form.innerHTML = html;

        const submitBtn = document.createElement('div');
        submitBtn.style.textAlign = 'center';
        submitBtn.style.marginTop = '30px';
        submitBtn.innerHTML =
            '<button type="button" class="btn btn-primary" onclick="submitQuiz()"><i class="fas fa-paper-plane"></i> Submit Assessment</button>';
        form.appendChild(submitBtn);

        window.assessmentData = data;
    }

    window.submitQuiz = function () {
        const questions = document.querySelectorAll('.question');
        let score = 0;
        let unanswered = [];

        questions.forEach((q, idx) => {
            q.classList.remove('unanswered');
            const selected = q.querySelector('input[type="radio"]:checked');
            const correctAnswer = window.assessmentData.questions[idx].answer;

            if (!selected) {
                unanswered.push(idx + 1);
                q.classList.add('unanswered');
                return;
            }

            const options = q.querySelectorAll('.option');
            options.forEach((opt) => {
                const radio = opt.querySelector('input[type="radio"]');
                if (radio.value === correctAnswer) {
                    opt.classList.add('correct');
                }
                if (selected && radio === selected && radio.value !== correctAnswer) {
                    opt.classList.add('incorrect');
                }
            });

            if (selected.value === correctAnswer) {
                score += 1;
            }

            const explanation = q.querySelector('.explanation');
            if (explanation) {
                explanation.style.display = 'block';
            }
        });

        if (unanswered.length > 0) {
            alert('Please answer all questions before submitting. Unanswered: Q' + unanswered.join(', Q'));
            return;
        }

        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('result-container').style.display = 'block';
        document.getElementById('score-display').innerText = score + ' / ' + window.assessmentData.questions.length;

        const percentage = (score / window.assessmentData.questions.length) * 100;
        let feedback = '';
        if (percentage === 100) feedback = 'Perfect Score! Outstanding work!';
        else if (percentage >= 80) feedback = 'Excellent! You have a strong understanding.';
        else if (percentage >= 60) feedback = 'Good job! You passed the assessment.';
        else feedback = 'Keep practicing. Review the topics and try again.';

        document.getElementById('feedback-text').innerText = feedback;
    };

    window.preparePrint = function () {
        const name = document.getElementById('student-name').value.trim();
        if (!name) {
            alert('Please enter your name before printing.');
            return;
        }
        document.getElementById('printed-name').textContent = 'Student: ' + name;
        window.print();
    };
})();
    </script>
