    <script type="text/plain" id="assessment-markdown">
# Assessment: TypeScript Basics - Part 2

**Total Questions:** 15  
**Time:** 15 minutes  
**Pass Mark:** 60%  
**Topics:** Environment Setup, JavaScript Fundamentals Recap, TypeScript Fundamentals

---

## Questions

### Question 1
What is the primary benefit of using TypeScript over JavaScript?

A) Faster runtime execution
B) Static type checking at compile time
C) Smaller bundle sizes
D) Built-in database support

**Answer: B) Static type checking at compile time**

**Explanation:** TypeScript adds static typing to JavaScript, catching type errors during development before code runs.

---

### Question 2
Which command installs TypeScript globally?

A) npm install typescript
B) npm install -g typescript
C) npm add typescript
D) npm global typescript

**Answer: B) npm install -g typescript**

**Explanation:** The `-g` flag installs TypeScript globally, making the `tsc` compiler available system-wide.

---

### Question 3
What does the `tsc` command do?

A) Runs TypeScript code directly
B) Compiles TypeScript to JavaScript
C) Debugs TypeScript code
D) Formats TypeScript files

**Answer: B) Compiles TypeScript to JavaScript**

**Explanation:** The TypeScript compiler (`tsc`) converts TypeScript (.ts) files into JavaScript (.js) files.

---

### Question 4
Which JavaScript variable declaration is block-scoped?

A) var
B) function
C) let and const
D) global

**Answer: C) let and const**

**Explanation:** `let` and `const` are block-scoped, while `var` is function-scoped, making them safer and more predictable.

---

### Question 5
What is the difference between `let` and `const`?

A) let is block-scoped, const is global
B) const creates immutable bindings, let allows reassignment
C) let is faster than const
D) They are identical

**Answer: B) const creates immutable bindings, let allows reassignment**

**Explanation:** `const` prevents reassignment of the variable binding, while `let` allows it. Both are block-scoped.

---

### Question 6
Which TypeScript type represents any value?

A) unknown
B) void
C) any
D) never

**Answer: C) any**

**Explanation:** The `any` type disables type checking for that variable, allowing it to hold any value (use sparingly).

---

### Question 7
What is the correct syntax for typing a function parameter?

A) function greet(name: string) {}
B) function greet(string name) {}
C) function greet(name string) {}
D) function greet<string>(name) {}

**Answer: A) function greet(name: string) {}**

**Explanation:** TypeScript uses `: type` syntax after the parameter name to specify its type.

---

### Question 8
What does the `number` type in TypeScript represent?

A) Only integers
B) Only decimals
C) Both integers and floating-point numbers
D) Only positive numbers

**Answer: C) Both integers and floating-point numbers**

**Explanation:** TypeScript's `number` type represents all numeric values, including integers and floats.

---

### Question 9
Which of the following is a primitive type in TypeScript?

A) Array
B) string
C) Object
D) Function

**Answer: B) string**

**Explanation:** Primitive types include string, number, boolean, null, undefined, symbol, and bigint.

---

### Question 10
What is type inference?

A) TypeScript guesses the type from the assigned value
B) TypeScript ignores types
C) TypeScript uses only `any` type
D) TypeScript requires explicit types everywhere

**Answer: A) TypeScript guesses the type from the assigned value**

**Explanation:** Type inference means TypeScript automatically determines the type based on the value assigned, reducing verbosity.

---

### Question 11
How do you specify an optional parameter in TypeScript?

A) function greet(name? string)
B) function greet(name?: string)
C) function greet(optional name: string)
D) function greet(name: string?)

**Answer: B) function greet(name?: string)**

**Explanation:** The `?` after the parameter name marks it as optional, allowing it to be undefined.

---

### Question 12
What is the return type of a function that doesn't return anything?

A) null
B) undefined
C) void
D) never

**Answer: C) void**

**Explanation:** `void` is used as the return type for functions that don't return a value.

---

### Question 13
Which file configures TypeScript compiler options?

A) package.json
B) tsconfig.json
C) typescript.json
D) config.ts

**Answer: B) tsconfig.json**

**Explanation:** `tsconfig.json` contains TypeScript project configuration, including compiler options and file inclusions.

---

### Question 14
What is the purpose of the `strict` option in tsconfig.json?

A) Makes code run faster
B) Enables all strict type-checking options
C) Disables all warnings
D) Allows any type everywhere

**Answer: B) Enables all strict type-checking options**

**Explanation:** The `strict` flag enables multiple strict type-checking options for safer code.

---

### Question 15
Which loop syntax is preferred in modern JavaScript/TypeScript?

A) for (var i = 0; i < arr.length; i++)
B) for...of loop
C) while loop only
D) goto statements

**Answer: B) for...of loop**

**Explanation:** `for...of` is cleaner and safer than traditional for loops, avoiding index errors and mutation issues.

    <script>
(() => {
    const markdownNode = document.getElementById('assessment-markdown');
    if (!markdownNode) {
        return;
    }

    const markdown = markdownNode.textContent.trim();
    const form = document.getElementById('quiz-form');
    const titleElement = document.querySelector('.assessment-title h1');
    const subtitleElement = document.querySelector('.assessment-title p');
    const scoreDisplay = document.getElementById('score-display');

    const assessmentData = parseAssessmentMarkdown(markdown);
    renderAssessment(assessmentData);

    function parseAssessmentMarkdown(raw) {
        const lines = raw.replace(/\r\n/g, '\n').split('\n');
        const titleLine = lines.find((line) => line.trim().startsWith('# ')) || '';
        const rawTitle = titleLine.replace(/^#\s*/, '').trim();
        const cleanedTitle = rawTitle
            .replace(/^Assessment\s*\d*\s*:?\s*/i, '')
            .replace(/\bMCQ\b/i, '')
            .trim();

        let topics = '';
        const topicsLine =
            lines.find((line) => /^\*\*Topics/i.test(line)) ||
            lines.find((line) => /^\*\*Topics Covered/i.test(line));
        if (topicsLine) {
            const parts = topicsLine.split(':');
            topics = parts.length > 1 ? parts.slice(1).join(':').replace(/\*\*/g, '').trim() : '';
        }

        if (!topics) {
            const subtitleLine = lines.find((line) => line.trim().startsWith('## '));
            if (subtitleLine) {
                topics = subtitleLine.replace(/^##\s*/, '').trim();
            }
        }

        const questionBlocks = [];
        const hasQuestionsHeading = lines.some((line) => /^##\s*Questions/i.test(line.trim()));
        let inQuestions = !hasQuestionsHeading;
        let stopQuestions = false;
        let current = null;

        for (const line of lines) {
            const trimmed = line.trim();

            if (/^##\s*Questions/i.test(trimmed)) {
                inQuestions = true;
                continue;
            }

            if (inQuestions && /^##\s+/i.test(trimmed) && !/^##\s*Questions/i.test(trimmed)) {
                stopQuestions = true;
                if (current) {
                    questionBlocks.push(current);
                    current = null;
                }
                continue;
            }

            if (!inQuestions || stopQuestions) {
                continue;
            }

            if (/^###\s*Question\s*\d+/i.test(trimmed)) {
                if (current) {
                    questionBlocks.push(current);
                }
                current = [];
                continue;
            }

            if (current) {
                current.push(line);
            }
        }

        if (current) {
            questionBlocks.push(current);
        }

        const questions = questionBlocks
            .map((block) => parseQuestionBlock(block))
            .filter((question) => question.options.length > 0);

        return {
            title: cleanedTitle || rawTitle || 'Assessment',
            topics,
            questions
        };
    }

    function parseQuestionBlock(lines) {
        const questionLines = [];
        const options = [];
        let answer = '';
        const explanationLines = [];
        let capturingExplanation = false;

        lines.forEach((line) => {
            const trimmed = line.trim();

            if (/^\*\*Answer:/i.test(trimmed)) {
                const match = trimmed.match(/Answer:\s*([A-D])/i);
                if (match) {
                    answer = match[1].toLowerCase();
                }
                capturingExplanation = false;
                return;
            }

            if (/^\*\*Explanation:/i.test(trimmed)) {
                capturingExplanation = true;
                const expText = trimmed.replace(/^\*\*Explanation:\s*/i, '').replace(/\*\*/g, '');
                if (expText) {
                    explanationLines.push(expText);
                }
                return;
            }

            if (capturingExplanation) {
                if (trimmed && !trimmed.startsWith('---')) {
                    explanationLines.push(trimmed);
                } else {
                    capturingExplanation = false;
                }
                return;
            }

            const optMatch = trimmed.match(/^([A-D])\)\s*(.+)$/);
            if (optMatch) {
                const optLetter = optMatch[1].toLowerCase();
                const optText = optMatch[2].trim();
                options.push({ id: optLetter, text: optText });
                return;
            }

            if (trimmed && !trimmed.startsWith('---') && !trimmed.startsWith('**')) {
                questionLines.push(trimmed);
            }
        });

        return {
            question: questionLines.join(' ').trim(),
            options,
            answer,
            explanation: explanationLines.join(' ').trim()
        };
    }

    function renderAssessment(data) {
        titleElement.textContent = data.title;
        subtitleElement.textContent = data.topics || 'Professional Automation Training';

        let html = '';
        data.questions.forEach((q, idx) => {
            html += '<div class="question" data-question="' + idx + '">';
            html += '<div class="question-text">';
            html += '<span class="question-number">Q' + (idx + 1) + '.</span>';
            html += '<span>' + q.question + '</span>';
            html += '</div>';
            html += '<div class="options">';
            q.options.forEach((opt) => {
                html += '<label class="option">';
                html +=
                    '<input type="radio" name="q' +
                    idx +
                    '" value="' +
                    opt.id +
                    '" data-question="' +
                    idx +
                    '">';
                html += '<span>' + opt.id.toUpperCase() + ') ' + opt.text + '</span>';
                html += '</label>';
            });
            html += '</div>';
            if (q.explanation) {
                html += '<div class="explanation">' + q.explanation + '</div>';
            }
            html += '</div>';
        });

        form.innerHTML = html;

        const submitBtn = document.createElement('div');
        submitBtn.style.textAlign = 'center';
        submitBtn.style.marginTop = '30px';
        submitBtn.innerHTML =
            '<button type="button" class="btn btn-primary" onclick="submitQuiz()"><i class="fas fa-paper-plane"></i> Submit Assessment</button>';
        form.appendChild(submitBtn);

        window.assessmentData = data;
    }

    window.submitQuiz = function () {
        const questions = document.querySelectorAll('.question');
        let score = 0;
        let unanswered = [];

        questions.forEach((q, idx) => {
            q.classList.remove('unanswered');
            const selected = q.querySelector('input[type="radio"]:checked');
            const correctAnswer = window.assessmentData.questions[idx].answer;

            if (!selected) {
                unanswered.push(idx + 1);
                q.classList.add('unanswered');
                return;
            }

            const options = q.querySelectorAll('.option');
            options.forEach((opt) => {
                const radio = opt.querySelector('input[type="radio"]');
                if (radio.value === correctAnswer) {
                    opt.classList.add('correct');
                }
                if (selected && radio === selected && radio.value !== correctAnswer) {
                    opt.classList.add('incorrect');
                }
            });

            if (selected.value === correctAnswer) {
                score += 1;
            }

            const explanation = q.querySelector('.explanation');
            if (explanation) {
                explanation.style.display = 'block';
            }
        });

        if (unanswered.length > 0) {
            alert('Please answer all questions before submitting. Unanswered: Q' + unanswered.join(', Q'));
            return;
        }

        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('result-container').style.display = 'block';
        document.getElementById('score-display').innerText = score + ' / ' + window.assessmentData.questions.length;

        const percentage = (score / window.assessmentData.questions.length) * 100;
        let feedback = '';
        if (percentage === 100) feedback = 'Perfect Score! Outstanding work!';
        else if (percentage >= 80) feedback = 'Excellent! You have a strong understanding.';
        else if (percentage >= 60) feedback = 'Good job! You passed the assessment.';
        else feedback = 'Keep practicing. Review the topics and try again.';

        document.getElementById('feedback-text').innerText = feedback;
    };

    window.preparePrint = function () {
        const name = document.getElementById('student-name').value.trim();
        if (!name) {
            alert('Please enter your name before printing.');
            return;
        }
        document.getElementById('printed-name').textContent = 'Student: ' + name;
        window.print();
    };
})();
    </script>
