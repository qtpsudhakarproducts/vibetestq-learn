    <style>

    <script type="text/plain" id="assessment-markdown">
# Assessment: QE Basics - Part 1

**Total Questions:** 15  
**Time:** 15 minutes  
**Pass Mark:** 60%  
**Topics:** Quality Engineering Overview, Manual vs Automation Testing, Test Automation Pyramid

---

## Questions

### Question 1
What is the primary goal of Quality Engineering?

A) Finding as many bugs as possible after development
B) Preventing defects through better engineering practices
C) Writing more test cases than developers write code
D) Ensuring all tests are automated

**Answer: B) Preventing defects through better engineering practices**

**Explanation:** Quality Engineering focuses on defect prevention rather than just detection, integrating quality throughout the development lifecycle.

---

### Question 2
Which testing principle emphasizes starting testing early in the development cycle?

A) Continuous Testing
B) Test-First Development
C) Shift-Left Testing
D) Exploratory Testing

**Answer: C) Shift-Left Testing**

**Explanation:** Shift-left testing moves testing activities earlier in the development cycle to prevent expensive late-stage bug fixes.

---

### Question 3
In a Quality Engineering culture, who is responsible for quality?

A) Only QE engineers
B) Only developers
C) Only the QA team
D) Everyone on the team

**Answer: D) Everyone on the team**

**Explanation:** Quality culture means quality is everyone's responsibility, with developers writing unit tests and QE engineers focusing on integration and E2E tests.

---

### Question 4
What is the main advantage of automated testing over manual testing?

A) It finds more bugs
B) It can simulate load and stress
C) It provides better UI/UX feedback
D) It requires no setup

**Answer: B) It can simulate load and stress**

**Explanation:** Automation enables performance, load, and stress testing that manual testing cannot achieve, along with faster execution for regression tests.

---

### Question 5
When is manual testing most appropriate?

A) For regression tests run daily
B) For exploratory and usability testing
C) For API performance testing
D) For database stress testing

**Answer: B) For exploratory and usability testing**

**Explanation:** Manual testing is best for scenarios requiring human judgment, such as exploratory testing, usability validation, and visual verification.

---

### Question 6
What is a key disadvantage of manual testing?

A) It cannot find unexpected issues
B) It is flexible and adaptable
C) It is time-consuming and prone to human error
D) It has no initial setup cost

**Answer: C) It is time-consuming and prone to human error**

**Explanation:** Manual testing is slow, error-prone, not repeatable, and expensive for regression testing compared to automation.

---

### Question 7
In the Test Automation Pyramid, which layer should have the most tests?

A) UI/E2E tests
B) Integration tests
C) Unit tests
D) Manual tests

**Answer: C) Unit tests**

**Explanation:** The pyramid recommends many unit tests at the base (fast, isolated), fewer integration tests in the middle, and fewest UI tests at the top.

---

### Question 8
Why are UI/E2E tests placed at the top of the pyramid?

A) They are the most important
B) They are slow, expensive, and brittle
C) They provide the best coverage
D) They are easiest to write

**Answer: B) They are slow, expensive, and brittle**

**Explanation:** UI tests are at the top because they are slow to execute, expensive to maintain, and more prone to flakiness, so fewer are needed.

---

### Question 9
What is the purpose of integration tests in the pyramid?

A) To test individual units in isolation
B) To validate the full user journey
C) To verify that components work together correctly
D) To replace unit tests

**Answer: C) To verify that components work together correctly**

**Explanation:** Integration tests validate interactions between components, APIs, and services without testing the entire UI.

---

### Question 10
What happens if you invert the test pyramid (ice cream cone anti-pattern)?

A) Tests run faster
B) Tests become more reliable
C) Test suite becomes slow and brittle
D) Development speed increases

**Answer: C) Test suite becomes slow and brittle**

**Explanation:** An inverted pyramid with mostly UI tests leads to slow execution, high maintenance costs, and flaky test results.

---

### Question 11
Which skill is most essential for a QE engineer in modern automation?

A) Manual test case writing only
B) Programming in languages like JavaScript, TypeScript, or Python
C) Hardware testing
D) Network administration

**Answer: B) Programming in languages like JavaScript, TypeScript, or Python**

**Explanation:** Modern QE engineers must be proficient in programming to design frameworks, write test scripts, and integrate with CI/CD pipelines.

---

### Question 12
What does continuous testing in CI/CD pipelines provide?

A) Eliminates the need for unit tests
B) Immediate feedback to developers on every commit
C) Reduces the number of tests needed
D) Replaces manual testing entirely

**Answer: B) Immediate feedback to developers on every commit**

**Explanation:** Continuous testing runs automated tests on every commit, providing fast feedback and catching issues early.

---

### Question 13
What is a key responsibility of a QE engineer?

A) Only writing manual test cases
B) Designing and implementing test automation frameworks
C) Avoiding collaboration with developers
D) Focusing only on UI testing

**Answer: B) Designing and implementing test automation frameworks**

**Explanation:** QE engineers design frameworks, write automated scripts, integrate with CI/CD, analyze results, and collaborate with developers.

---

### Question 14
Which of the following is NOT a principle of Quality Engineering?

A) Test Automation First
B) Shift-Left Testing
C) Testing only at the end
D) Continuous Testing

**Answer: C) Testing only at the end**

**Explanation:** Quality Engineering emphasizes early and continuous testing, not testing only at the end, which is an outdated QA approach.

---

### Question 15
What type of testing should be automated first?

A) One-time exploratory tests
B) Repetitive regression tests
C) Visual design validation
D) Ad-hoc usability tests

**Answer: B) Repetitive regression tests**

**Explanation:** Automation provides the most value for repetitive, stable test scenarios like regression tests that run frequently.

---

    <script>
(() => {
    const markdownNode = document.getElementById('assessment-markdown');
    if (!markdownNode) {
        return;
    }

    const markdown = markdownNode.textContent.trim();
    const form = document.getElementById('quiz-form');
    const titleElement = document.querySelector('.assessment-title h1');
    const subtitleElement = document.querySelector('.assessment-title p');
    const scoreDisplay = document.getElementById('score-display');

    const assessmentData = parseAssessmentMarkdown(markdown);
    renderAssessment(assessmentData);

    function parseAssessmentMarkdown(raw) {
        const lines = raw.replace(/\r\n/g, '\n').split('\n');
        const titleLine = lines.find((line) => line.trim().startsWith('# ')) || '';
        const rawTitle = titleLine.replace(/^#\s*/, '').trim();
        const cleanedTitle = rawTitle
            .replace(/^Assessment\s*\d*\s*:?\s*/i, '')
            .replace(/\bMCQ\b/i, '')
            .trim();

        let topics = '';
        const topicsLine =
            lines.find((line) => /^\*\*Topics/i.test(line)) ||
            lines.find((line) => /^\*\*Topics Covered/i.test(line));
        if (topicsLine) {
            const parts = topicsLine.split(':');
            topics = parts.length > 1 ? parts.slice(1).join(':').replace(/\*\*/g, '').trim() : '';
        }

        if (!topics) {
            const subtitleLine = lines.find((line) => line.trim().startsWith('## '));
            if (subtitleLine) {
                topics = subtitleLine.replace(/^##\s*/, '').trim();
            }
        }

        const questionBlocks = [];
        const hasQuestionsHeading = lines.some((line) => /^##\s*Questions/i.test(line.trim()));
        let inQuestions = !hasQuestionsHeading;
        let stopQuestions = false;
        let current = null;

        for (const line of lines) {
            const trimmed = line.trim();

            if (/^##\s*Questions/i.test(trimmed)) {
                inQuestions = true;
                continue;
            }

            if (inQuestions && /^##\s+/i.test(trimmed) && !/^##\s*Questions/i.test(trimmed)) {
                stopQuestions = true;
                if (current) {
                    questionBlocks.push(current);
                    current = null;
                }
                continue;
            }

            if (!inQuestions || stopQuestions) {
                continue;
            }

            if (/^###\s*Question\s*\d+/i.test(trimmed)) {
                if (current) {
                    questionBlocks.push(current);
                }
                current = [];
                continue;
            }

            if (current) {
                current.push(line);
            }
        }

        if (current) {
            questionBlocks.push(current);
        }

        const questions = questionBlocks
            .map((block) => parseQuestionBlock(block))
            .filter((question) => question.options.length > 0);

        return {
            title: cleanedTitle || rawTitle || 'Assessment',
            topics,
            questions
        };
    }

    function parseQuestionBlock(lines) {
        const questionLines = [];
        const options = [];
        let answer = '';
        const explanationLines = [];
        let capturingExplanation = false;

        lines.forEach((line) => {
            const trimmed = line.trim();

            if (/^\*\*Answer:/i.test(trimmed)) {
                const match = trimmed.match(/Answer:\s*([A-D])/i);
                if (match) {
                    answer = match[1].toLowerCase();
                }
                capturingExplanation = false;
                return;
            }

            if (/^\*\*Explanation:/i.test(trimmed)) {
                capturingExplanation = true;
                const expText = trimmed.replace(/^\*\*Explanation:\s*/i, '').replace(/\*\*/g, '');
                if (expText) {
                    explanationLines.push(expText);
                }
                return;
            }

            if (capturingExplanation) {
                if (trimmed && !trimmed.startsWith('---')) {
                    explanationLines.push(trimmed);
                } else {
                    capturingExplanation = false;
                }
                return;
            }

            const optMatch = trimmed.match(/^([A-D])\)\s*(.+)$/);
            if (optMatch) {
                const optLetter = optMatch[1].toLowerCase();
                const optText = optMatch[2].trim();
                options.push({ id: optLetter, text: optText });
                return;
            }

            if (trimmed && !trimmed.startsWith('---') && !trimmed.startsWith('**')) {
                questionLines.push(trimmed);
            }
        });

        return {
            question: questionLines.join(' ').trim(),
            options,
            answer,
            explanation: explanationLines.join(' ').trim()
        };
    }

    function renderAssessment(data) {
        titleElement.textContent = data.title;
        subtitleElement.textContent = data.topics || 'Professional Automation Training';

        let html = '';
        data.questions.forEach((q, idx) => {
            html += '<div class="question" data-question="' + idx + '">';
            html += '<div class="question-text">';
            html += '<span class="question-number">Q' + (idx + 1) + '.</span>';
            html += '<span>' + q.question + '</span>';
            html += '</div>';
            html += '<div class="options">';
            q.options.forEach((opt) => {
                html += '<label class="option">';
                html +=
                    '<input type="radio" name="q' +
                    idx +
                    '" value="' +
                    opt.id +
                    '" data-question="' +
                    idx +
                    '">';
                html += '<span>' + opt.id.toUpperCase() + ') ' + opt.text + '</span>';
                html += '</label>';
            });
            html += '</div>';
            if (q.explanation) {
                html += '<div class="explanation">' + q.explanation + '</div>';
            }
            html += '</div>';
        });

        form.innerHTML = html;

        const submitBtn = document.createElement('div');
        submitBtn.style.textAlign = 'center';
        submitBtn.style.marginTop = '30px';
        submitBtn.innerHTML =
            '<button type="button" class="btn btn-primary" onclick="submitQuiz()"><i class="fas fa-paper-plane"></i> Submit Assessment</button>';
        form.appendChild(submitBtn);

        window.assessmentData = data;
    }

    window.submitQuiz = function () {
        const questions = document.querySelectorAll('.question');
        let score = 0;
        let unanswered = [];

        questions.forEach((q, idx) => {
            q.classList.remove('unanswered');
            const selected = q.querySelector('input[type="radio"]:checked');
            const correctAnswer = window.assessmentData.questions[idx].answer;

            if (!selected) {
                unanswered.push(idx + 1);
                q.classList.add('unanswered');
                return;
            }

            const options = q.querySelectorAll('.option');
            options.forEach((opt) => {
                const radio = opt.querySelector('input[type="radio"]');
                if (radio.value === correctAnswer) {
                    opt.classList.add('correct');
                }
                if (selected && radio === selected && radio.value !== correctAnswer) {
                    opt.classList.add('incorrect');
                }
            });

            if (selected.value === correctAnswer) {
                score += 1;
            }

            const explanation = q.querySelector('.explanation');
            if (explanation) {
                explanation.style.display = 'block';
            }
        });

        if (unanswered.length > 0) {
            alert('Please answer all questions before submitting. Unanswered: Q' + unanswered.join(', Q'));
            return;
        }

        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('result-container').style.display = 'block';
        document.getElementById('score-display').innerText = score + ' / ' + window.assessmentData.questions.length;

        const percentage = (score / window.assessmentData.questions.length) * 100;
        let feedback = '';
        if (percentage === 100) feedback = 'Perfect Score! Outstanding work!';
        else if (percentage >= 80) feedback = 'Excellent! You have a strong understanding.';
        else if (percentage >= 60) feedback = 'Good job! You passed the assessment.';
        else feedback = 'Keep practicing. Review the topics and try again.';

        document.getElementById('feedback-text').innerText = feedback;
    };

    window.preparePrint = function () {
        const name = document.getElementById('student-name').value.trim();
        if (!name) {
            alert('Please enter your name before printing.');
            return;
        }
        document.getElementById('printed-name').textContent = 'Student: ' + name;
        window.print();
    };
})();
    </script>
