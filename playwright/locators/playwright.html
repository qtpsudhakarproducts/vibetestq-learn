    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --primary-light: #eff6ff;
            --secondary: #6366f1;
            --accent: #f59e0b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
            --sidebar-width: 320px;
            --header-height: 70px;
            --glass: rgba(255, 255, 255, 0.9);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: 'Outfit', sans-serif;
            color: var(--text);
            margin-bottom: 1rem;
            margin-top: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--primary-dark);
        }

        h2 {
            font-size: 1.8rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
            margin-top: 3rem;
        }

        h3 {
            font-size: 1.4rem;
            color: var(--secondary);
        }

        p {
            margin-bottom: 1.2rem;
        }

        code {
            background: #f1f5f9;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: 'Fira Code', monospace;
            font-size: 0.9em;
            color: #d946ef;
        }

        pre[class*="language-"] {
            border-radius: 12px;
            margin: 1.5rem 0;
            box-shadow: var(--shadow);
            font-size: 0.9rem;
            position: relative;
        }

        /* Layout */
        .app-container {
            display: flex;
            min-height: 100vh;
        }

        header {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            height: var(--header-height);
            background: var(--glass);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            gap: 1rem;
        }

        .back-to-home {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--primary-light);
            color: var(--primary);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .back-to-home:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateX(-2px);
        }

        .back-to-home i {
            transition: transform 0.2s;
        }

        .back-to-home:hover i {
            transform: translateX(-3px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--primary-dark);
            text-decoration: none;
        }

        .logo img {
            height: 40px;
        }

        /* Sidebar */
        aside {
            width: var(--sidebar-width);
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: var(--header-height);
            overflow-y: auto;
            z-index: 900;
        }

        .sidebar-content {
            padding: 2rem 1.5rem;
        }

        .nav-section h4 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-light);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .nav-list {
            list-style: none;
        }

        .nav-item {
            margin-bottom: 0.2rem;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            color: var(--text);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .nav-link:hover {
            background-color: var(--primary-light);
            color: var(--primary);
        }

        .nav-link.active {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        /* Main Content */
        main {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding-top: var(--header-height);
            min-height: 100vh;
        }

        .content-area {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        /* Markdown Styling */
        #docs-content ul,
        #docs-content ol {
            margin-left: 1.5rem;
            margin-bottom: 1.5rem;
        }

        #docs-content li {
            margin-bottom: 0.5rem;
        }

        #docs-content blockquote {
            padding: 1rem 1.5rem;
            background: var(--primary-light);
            border-left: 4px solid var(--primary);
            border-radius: 0 8px 8px 0;
            margin: 1.5rem 0;
            font-style: italic;
            color: var(--primary-dark);
        }

        #docs-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        #docs-content th,
        #docs-content td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        #docs-content th {
            background-color: var(--primary-light);
            color: var(--primary-dark);
            font-weight: 600;
        }

        #docs-content img {
            max-width: 100%;
            border-radius: 12px;
            margin: 1.5rem 0;
            box-shadow: var(--shadow);
        }

        /* UI Elements */
        .alert {
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin: 1.5rem 0;
            border-left: 5px solid;
        }

        .alert-info {
            background: #eff6ff;
            border-color: #3b82f6;
            color: #1e40af;
        }

        .loader {
            text-align: center;
            padding: 4rem;
            color: var(--text-light);
            font-size: 1.2rem;
        }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #cbd5e1;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s;
        }

        pre:hover .copy-btn {
            opacity: 1;
        }

        .copy-btn:hover {
            background: var(--primary);
            color: white;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        .btn-nav {
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-prev {
            color: var(--text-light);
        }

        .btn-next {
            background: var(--primary);
            color: white;
        }

        .top-nav {
            margin-top: 0;
            margin-bottom: 3rem;
            padding-top: 0;
            padding-bottom: 2rem;
            border-top: none;
            border-bottom: 1px solid var(--border);
        }

            margin-top: 5rem;
            padding: 2rem;
            text-align: center;
            border-top: 1px solid var(--border);
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--primary);
        }

        @media (max-width: 1024px) {
            aside {
                transform: translateX(-100%);
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.2);
            }

            aside.open {
                transform: translateX(0);
            }

            main {
                margin-left: 0;
            }

            .mobile-menu-btn {
                display: block;
            }

            .back-to-home span {
                display: none;
            }

            .back-to-home {
                padding: 8px 12px;
            }

            .logo span {
                display: none;
            }

            header {
                padding: 0 1rem;
            }
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 850;
            backdrop-filter: blur(4px);
        }

        .sidebar-overlay.active {
            display: block;
        }

        let currentModule = '';
        let currentSectionIndex = 0;

        function init(moduleName) {
            currentModule = moduleName;
            renderSidebar();

            const hash = window.location.hash.substring(1);
            const initialSection = sectionsData[currentModule].find(s => s.id === hash) || sectionsData[currentModule][0];

            showSection(initialSection.id);
        }

        function renderSidebar() {
            const nav = document.getElementById('sidebar-nav');
            const sections = sectionsData[currentModule];

            let html = `
                <div class="nav-section">
                    <h4>${currentModule.toUpperCase()} MASTERY</h4>
                    <ul class="nav-list">
                        ${sections.map((section, index) => `
                            <li class="nav-item">
                                <a href="#${section.id}" class="nav-link" id="link-${section.id}" onclick="showSection('${section.id}')">
                                    <i class="fas fa-chevron-right"></i>
                                    ${section.title}
                                </a>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            `;
            nav.innerHTML = html;
        }

        async function showSection(sectionId) {
            const sections = sectionsData[currentModule];
            const index = sections.findIndex(s => s.id === sectionId);
            if (index === -1) return;

            currentSectionIndex = index;
            const section = sections[index];

            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            document.getElementById(`link-${sectionId}`).classList.add('active');

            const contentArea = document.getElementById('docs-content');
            contentArea.innerHTML = '<div class="loader">Loading...</div>';

            try {
                let markdown;
                if (window.SketchnoteRenderer && typeof window.SketchnoteRenderer.fetchMarkdown === 'function') {
                    markdown = await window.SketchnoteRenderer.fetchMarkdown(section.file, { cache: 'no-store' });
                } else {
                    const response = await fetch(section.file, { cache: 'no-store' });
                    markdown = await response.text();
                }
                contentArea.innerHTML = marked.parse(markdown);

                Prism.highlightAll();

                const mermaidDivs = contentArea.querySelectorAll('.language-mermaid');
                mermaidDivs.forEach((div, i) => {
                    const code = div.textContent;
                    const containerId = `mermaid-${i}`;
                    const container = document.createElement('div');
                    container.id = containerId;
                    div.parentNode.replaceChild(container, div);
                    mermaid.render(containerId, code).then(({ svg }) => {
                        container.innerHTML = svg;
                    });
                });

                contentArea.querySelectorAll('pre').forEach(pre => {
                    const button = document.createElement('button');
                    button.className = 'copy-btn';
                    button.innerText = 'Copy';
                    button.onclick = () => {
                        const code = pre.querySelector('code').innerText;
                        navigator.clipboard.writeText(code).then(() => {
                            button.innerText = 'Copied!';
                            setTimeout(() => button.innerText = 'Copy', 2000);
                        });
                    };
                    pre.appendChild(button);
                });

                updateNavButtons();
                window.scrollTo({ top: 0, behavior: 'smooth' });

                // Close sidebar on mobile
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('overlay');
                if (sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('active');
                }

            } catch (error) {
                contentArea.innerHTML = `<div class="alert alert-error">Error loading section: ${error.message}</div>`;
            }
        }

        function updateNavButtons() {
            const sections = sectionsData[currentModule];
            const prevBtnTop = document.querySelector('.top-nav .prev-btn');
            const nextBtnTop = document.querySelector('.top-nav .next-btn');
            const prevBtnBottom = document.querySelector('#nav-btns-bottom .prev-btn');
            const nextBtnBottom = document.querySelector('#nav-btns-bottom .next-btn');
            const topNav = document.getElementById('nav-btns-top');
            const bottomNav = document.getElementById('nav-btns-bottom');

            topNav.style.display = 'flex';
            bottomNav.style.display = 'flex';

            if (currentSectionIndex > 0) {
                const prevSection = sections[currentSectionIndex - 1];
                [prevBtnTop, prevBtnBottom].forEach(btn => {
                    btn.style.visibility = 'visible';
                    btn.onclick = () => showSection(prevSection.id);
                });
            } else {
                [prevBtnTop, prevBtnBottom].forEach(btn => btn.style.visibility = 'hidden');
            }

            if (currentSectionIndex < sections.length - 1) {
                const nextSection = sections[currentSectionIndex + 1];
                [nextBtnTop, nextBtnBottom].forEach(btn => {
                    btn.style.visibility = 'visible';
                    btn.onclick = () => showSection(nextSection.id);
                });
            } else {
                [nextBtnTop, nextBtnBottom].forEach(btn => btn.style.visibility = 'hidden');
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        window.onload = () => {
            mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
            init('playwright');
        };
    </script>
</body>

</html>
