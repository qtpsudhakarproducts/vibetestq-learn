<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Docs Login | Vibetestq</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --border: #e2e8f0;
      --success: #047857;
      --error: #dc2626;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #eff6ff 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(100%, 440px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      padding: 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-weight: 700;
      color: var(--primary-dark);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.7rem;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.5;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px 16px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    button:hover { transform: translateY(-1px); }

    .btn-github {
      background: #111827;
      color: white;
      box-shadow: 0 8px 18px rgba(17,24,39,.16);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-github:hover { box-shadow: 0 10px 22px rgba(17,24,39,.22); }

    .status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      display: none;
    }

    .status.success {
      display: block;
      background: #ecfdf5;
      color: var(--success);
      border: 1px solid #a7f3d0;
    }

    .status.error {
      display: block;
      background: #fef2f2;
      color: var(--error);
      border: 1px solid #fecaca;
    }

    .small {
      margin-top: 14px;
      font-size: 0.88rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">🔐 Vibetestq Docs</div>
    <h1>Sign in to continue</h1>
    <p>Use your GitHub account to access the protected docs area.</p>

    <button id="githubLoginBtn" class="btn-github" type="button">Continue with GitHub</button>

    <div id="status" class="status"></div>
    <div class="small">You will be redirected back to the docs section after sign-in.</div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      GithubAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBFlp21T_oghQMpH0y5D7N9p3dqNQfBtxg",
      authDomain: "vibetestq-b3eb9.firebaseapp.com",
      projectId: "vibetestq-b3eb9",
      storageBucket: "vibetestq-b3eb9.firebasestorage.app",
      messagingSenderId: "334461164720",
      appId: "1:334461164720:web:5f563cca7e91f00e33ef75",
      measurementId: "G-B7E47M7147"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const statusEl = document.getElementById("status");
    const loginBtn = document.getElementById("githubLoginBtn");

    const params = new URLSearchParams(window.location.search);
    const redirectTo = params.get("redirect") || "/";

    function showStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`;
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        showStatus(`Signed in as ${user.displayName || user.email}. Redirecting...`, "success");
        window.setTimeout(() => {
          window.location.replace(redirectTo);
        }, 700);
      } else {
        loginBtn.disabled = false;
      }
    });

    loginBtn.addEventListener("click", async () => {
      loginBtn.disabled = true;
      showStatus("Opening GitHub sign-in popup...", "success");

      try {
        const provider = new GithubAuthProvider();
        provider.addScope("read:user");
        provider.addScope("user:email");

        const result = await signInWithPopup(auth, provider);
        if (result?.user) {
          showStatus("Sign-in successful. Redirecting...", "success");
          window.setTimeout(() => {
            window.location.replace(redirectTo);
          }, 700);
        } else {
          loginBtn.disabled = false;
        }
      } catch (error) {
        loginBtn.disabled = false;
        console.error(error);
        showStatus(error.message || "GitHub sign-in failed.", "error");
      }
    });
  </script>
</body>
</html>
